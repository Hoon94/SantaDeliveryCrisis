<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>산타의 작업실 탈출 · 디자인 매뉴얼 · 나이트 글로우 시안</title>
<style>
/* ============ 페이지 공통 ============ */
:root{--page:#eceef2;--pagetext:#14161a;--pagesub:#5b6270;--pline:#d9dce3;--ppanel:#fff;--pbrand:#c8382b}
body[data-mode=dark]{--page:#0d0e11;--pagetext:#f2f3f5;--pagesub:#9aa1ae;--pline:#2a2d35;--ppanel:#171a20}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif;background:var(--page);color:var(--pagetext);transition:background .3s}
code{font-family:ui-monospace,Menlo,monospace;font-size:.92em;background:color-mix(in srgb,var(--pagetext) 8%,transparent);padding:1px 5px;border-radius:5px}

/* ============ 스킨 토큰 (room = 작업실 / night = 나이트 글로우) ============ */
[data-skin=room] .screen{--bg:#fbf3e6;--card:#fffdf8;--text:#2b1a14;--sub:#8c6f62;--accent:#c8382b;--onacc:#fff;--ok:#2f8f5b;--bad:#d64545;--line:#ecdcc6;--soft:#f6ead6;--tab:#fffaf0;--wall:#f4dfc0;--floor:#c99d6b;--win:#bfe3ff;--easy:#2f8f5b;--mid:#d98a1c;--hard:#c8382b;--dis:#d9cfc0;--distx:#8f7f6e;--rc:14px;--rb:14px;--t1:#2fa86a;--t2:#26905a;--t3:#1f7a46;--trunk:#7a4a2b;--star:#ffd23f;--night:linear-gradient(#17304a,#0b1a2b);--hero:linear-gradient(135deg,#1b6b42,#0f432b)}
[data-skin=room][data-mode=dark] .screen{--bg:#0c1a14;--card:#14271e;--text:#f7eedc;--sub:#9fb5a7;--accent:#ff6a5c;--onacc:#2a0b07;--ok:#4ed08a;--bad:#ff7a7a;--line:#254036;--soft:#1a3026;--tab:#0f2019;--wall:#16291f;--floor:#3b2a1c;--win:#0b2b4e;--easy:#4ed08a;--mid:#f0b04a;--hard:#ff6a5c;--dis:#2a3b33;--distx:#7d9285;--hero:linear-gradient(135deg,#1f7a4c,#0f3b27)}
[data-skin=night] .screen{--bg:linear-gradient(#cfe0ff,#f6f9ff 72%);--card:#fff;--text:#1b2a55;--sub:#556493;--accent:#d04616;--onacc:#fff;--ok:#1f9d63;--bad:#d93a54;--line:#d5def5;--soft:#eaf0ff;--tab:rgba(255,255,255,.86);--easy:#1f9d63;--mid:#b86e00;--hard:#d93a54;--dis:#d5def5;--distx:#7683ad;--rc:20px;--rb:999px;--t1:#2f9a8a;--t2:#25857a;--t3:#1c6f68;--trunk:#6b4a3a;--star:#ffd23f;--night:linear-gradient(#17304a,#0b1a2b);--hero:linear-gradient(135deg,#2a3a8c,#171f5c)}
[data-skin=night][data-mode=dark] .screen{--bg:linear-gradient(#070a22,#1b2158 82%);--card:#151a42;--text:#f2f4ff;--sub:#a3aedd;--accent:#ffd96b;--onacc:#3a2600;--ok:#35d38d;--bad:#ff6b81;--line:#2d3570;--soft:#1f2557;--tab:rgba(14,18,52,.9);--easy:#35d38d;--mid:#ffb020;--hard:#ff6b81;--dis:#2d3570;--distx:#7783b8;--t1:#1f6f64;--t2:#17594f;--t3:#10463f;--trunk:#4a3226}
/* 겹쳐 뜨는 패널(시트·알림·토스트)은 퀴즈 화면의 색 재정의와 상관없이 기본 색을 씁니다 */
.screen{--pc:var(--card);--pt:var(--text);--ps:var(--sub);--pl:var(--line);--pa:var(--accent);--pbad:var(--bad);--psoft:var(--soft)}

/* ============ iPhone 프레임 ============ */
.phone{width:320px;height:700px;border-radius:44px;background:#000;padding:8px;box-shadow:0 20px 50px rgba(0,0,0,.28);flex:none}
.screen{position:relative;width:100%;height:100%;border-radius:36px;overflow:hidden;background:var(--bg);color:var(--text);font-size:13px;line-height:1.4}
.screen :where(*:has(>.mk)){position:relative}
.island{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:80px;height:22px;background:#000;border-radius:20px;z-index:60}
.status{position:absolute;top:0;left:0;right:0;height:38px;display:flex;justify-content:space-between;align-items:center;padding:6px 24px 0;font-size:12px;font-weight:700;z-index:55}
.body{position:absolute;inset:0;padding:48px 20px 34px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.body.wt{padding-bottom:88px}
.body.center{justify-content:center}
.home-ind{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:100px;height:4px;border-radius:4px;background:var(--text);opacity:.8;z-index:58}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:78px;background:var(--tab);border-top:1px solid var(--line);display:flex;padding:8px 6px 0;z-index:7;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.tabbar div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:700;color:var(--sub)}
.tabbar div.on{color:var(--accent)}
.tabbar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ============ 번호 마커 (화면 설계서에서만 표시) ============ */
.mk{position:absolute;left:-7px;top:-7px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:#e11d48;color:#fff;font:800 10px/18px -apple-system,sans-serif;text-align:center;font-style:normal;z-index:70;box-shadow:0 0 0 2px #fff;pointer-events:none;letter-spacing:0;text-shadow:none}
.mk.rt{left:auto;right:-7px}
.mk.in{left:-14px;top:0}
.nomk .mk{display:none}

/* ============ 공통 컴포넌트 ============ */
.nav{display:flex;align-items:center;justify-content:space-between;min-height:30px;font-weight:700;gap:8px}
.nav .t{font-size:14px;text-align:center;flex:1}
.nav .l,.nav .r{font-size:13px;color:var(--accent);font-weight:700;min-width:64px;white-space:nowrap}
.nav .r{text-align:right}
.xbtn{width:30px;height:30px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--text);font-size:13px;font-weight:800;flex:none}
.title{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.title.sm{font-size:20px}
.sub{color:var(--sub);font-size:11.5px}
.k{font-weight:700}
.sp{flex:1}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rc);padding:10px 12px}
.card.soft{background:var(--soft);border-color:transparent}
.card.acc{border-color:var(--accent);border-width:1.5px}
.btn{display:block;text-align:center;padding:14px;border-radius:var(--rb);background:var(--accent);color:var(--onacc);font-weight:800;font-size:15px;box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 60%,#000);line-height:1.2}
[data-skin=night] .btn{box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 32%,transparent)}
.btn.ghost{background:transparent;color:var(--accent);box-shadow:none;border:2px solid var(--accent);padding:12px}
.btn.off{background:var(--dis);color:var(--distx);box-shadow:none}
.btn.bad{background:var(--bad);color:#fff}
.btn.sm{padding:10px;font-size:13px}
.btn.gold{background:#ffd96b;color:#4a2a00;box-shadow:0 4px 0 #c9a43a}
.link{text-align:center;color:var(--accent);font-weight:800;font-size:13px;padding:2px 0}
.chip{display:inline-block;border-radius:999px;padding:2px 9px;font-size:10.5px;font-weight:700;background:var(--soft);color:var(--sub);margin-right:4px;white-space:nowrap}
.chip.red{background:var(--accent);color:var(--onacc)}
.chip.grn{background:var(--ok);color:#fff}
.chip.dis{background:var(--dis);color:var(--distx)}
.chip.bad{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.badge{display:inline-block;font-size:10px;font-weight:800;padding:2px 8px;border-radius:99px;color:#fff}
.b-easy{background:var(--easy)}.b-mid{background:var(--mid)}.b-hard{background:var(--hard)}
.pb{height:6px;border-radius:6px;background:var(--soft);overflow:hidden;flex:none}
.pb i{display:block;height:100%;border-radius:6px;background:var(--accent)}
.pb.g i{background:var(--ok)}
.ico{width:38px;height:38px;border-radius:11px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.seg{display:flex;background:var(--soft);border-radius:var(--rb);padding:3px;gap:3px}
.seg span{flex:1;text-align:center;padding:7px 0;border-radius:var(--rb);font-weight:700;font-size:12px;color:var(--sub)}
.seg span.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.toggle{width:40px;height:24px;border-radius:12px;background:var(--ok);position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:#fff}
.toggle.off{background:var(--dis)}.toggle.off::after{right:auto;left:2px}
.item{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.x{color:var(--bad);font-weight:800}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;padding:0 6px}
.empty .big{font-size:38px}
.field{background:var(--card);border:1px solid var(--line);border-radius:var(--rc);padding:9px 12px;color:var(--sub)}
.field.err{border-color:var(--bad);border-width:1.5px}
.errtx{color:var(--bad);font-size:11px;font-weight:700;margin-top:4px}
.dim{opacity:.55}

/* ============ 트리 ============ */
.treewrap{position:relative;border-radius:22px;overflow:hidden;flex:1;min-height:0;display:flex;align-items:flex-end;justify-content:center}
[data-skin=room] .treewrap{background:var(--wall)}
[data-skin=night][data-mode=dark] .treewrap{background:radial-gradient(ellipse at 50% 78%,rgba(255,224,130,.16),transparent 62%)}
.treewrap svg{width:100%;height:100%;display:block}
.treewrap .cnt{position:absolute;top:10px;right:10px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-weight:800;font-size:11px;z-index:2}
.treewrap .cnt.l{right:auto;left:10px}
[data-skin=room] .only-night,[data-skin=night] .only-room{display:none}
.t1{fill:var(--t1)}.t2{fill:var(--t2)}.t3{fill:var(--t3)}.trunk{fill:var(--trunk)}
.snow circle{animation:snow 4s linear infinite}
@keyframes snow{from{transform:translateY(-6px);opacity:0}30%{opacity:1}to{transform:translateY(34px);opacity:0}}
.glow{animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{opacity:.4}}
[data-skin=night] .orng{filter:drop-shadow(0 0 4px var(--c))}
.nstar{fill:#fff;opacity:.85}
[data-skin=night]:not([data-mode=dark]) .nstar{fill:#8fa6e8;opacity:.6}
.ground-n{fill:#fff;opacity:.9}
[data-skin=night][data-mode=dark] .ground-n{fill:#aeb8f0;opacity:.35}

/* ============ S1 ============ */
.hd{display:flex;align-items:center;gap:8px}
.hd .hdn{flex:1}
.hd .hdn small{display:block;color:var(--sub);font-size:11px;font-weight:600;margin-top:1px}
.pillbtn{font-size:11px;font-weight:800;padding:6px 11px;border-radius:99px;background:var(--card);border:1px solid var(--line);white-space:nowrap}
.left{text-align:center;font-size:13px;color:var(--sub)}
.left b{color:var(--accent);font-size:15px}
.h2{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:14px;margin:0 2px}
.h2 small{font-weight:600;font-size:11px;color:var(--sub)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--rc);padding:8px 4px;text-align:center}
.tile b{display:block;font-size:20px;line-height:1.15;margin:3px 0 0}
.tile .bar{height:5px;border-radius:5px;background:var(--soft);overflow:hidden;margin:6px 8px 0}
.tile .bar i{display:block;height:100%}
.resume{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1.5px solid var(--accent);border-radius:var(--rc);background:var(--card)}

/* ============ S2 ============ */
.tcard{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--rc);padding:11px 12px}
.tcard.rec{border-color:var(--accent);border-width:1.5px}
.tcard .ico{background:color-mix(in srgb,var(--cc) 20%,var(--soft))}
.tcard .pb i{background:var(--cc)}
.tcard.nodata .pb{opacity:.6}

/* ============ 시트 · 팝업 · 알림 · 토스트 ============ */
.dimbg{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:40}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:41;background:var(--pc);color:var(--pt);border-radius:24px 24px 0 0;padding:10px 18px 26px;display:flex;flex-direction:column;gap:9px;--card:var(--pc);--text:var(--pt);--sub:var(--ps);--line:var(--pl);--soft:var(--psoft);--accent:var(--pa)}
.sheet .grab{width:38px;height:4px;border-radius:3px;background:var(--pl);margin:0 auto 2px}
[data-skin=night] .sheet{left:14px;right:14px;bottom:auto;top:50%;transform:translateY(-50%);border-radius:28px;padding:18px 16px 16px;box-shadow:0 20px 60px rgba(0,0,0,.35);border:1px solid var(--pl)}
[data-skin=night] .sheet .grab{display:none}
.sheet h3,.sheet .h3{font-size:12px;color:var(--ps);font-weight:800;margin-top:2px}
.sheet h3 small,.h3 small{font-weight:600}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.opt{border:2px solid var(--line);background:var(--soft);border-radius:calc(var(--rc) - 2px);padding:8px 4px;text-align:center;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
.opt .st{font-size:10px;letter-spacing:1px;color:var(--c)}
.opt b{font-size:15px}
.opt.q b{font-size:24px;line-height:1.1}
.opt small{font-size:10px;color:var(--sub);font-weight:700}
.opt.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--soft))}
.opt.lock{opacity:.5;background:var(--dis);border-color:transparent}
.opt.lock::after{content:"🔒";position:absolute;top:3px;right:5px;font-size:10px}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tags .chip{margin:0;padding:4px 10px;font-size:11px}
.alert{position:absolute;left:34px;right:34px;top:50%;transform:translateY(-50%);z-index:42;background:var(--pc);color:var(--pt);border-radius:18px;text-align:center;padding:18px 14px 0;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.alert h4{font-size:15px;font-weight:800;line-height:1.35}
.alert p{font-size:12px;color:var(--ps);margin-top:6px;line-height:1.5}
.alert .ab{display:flex;border-top:1px solid var(--pl);margin:16px -14px 0}
.alert .ab span{flex:1;padding:12px 4px;font-weight:700;color:var(--pa);font-size:14px;position:relative}
.alert .ab span+span{border-left:1px solid var(--pl)}
.alert .ab span.b{font-weight:800}
.alert .ab span.d{color:var(--pbad)}
.alert .ab.v{flex-direction:column}
.alert .ab.v span+span{border-left:0;border-top:1px solid var(--pl)}
.toast{position:absolute;left:24px;right:24px;bottom:100px;z-index:44;background:#1f2330;color:#fff;border-radius:14px;padding:11px 14px;font-weight:700;font-size:12.5px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.toast.top{bottom:auto;top:52px}
.loading{position:absolute;inset:0;z-index:45;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:color-mix(in srgb,var(--bg) 78%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);font-weight:700}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============ 퀴즈 (S4·S5) ============ */
/* 나이트 글로우의 퀴즈 화면은 작업 색으로 가득 채웁니다(v3) */
[data-skin=night] .screen.q{background:linear-gradient(165deg,color-mix(in srgb,var(--oc) 62%,#10122e),color-mix(in srgb,var(--oc) 28%,#10122e));color:#fff}
[data-skin=night] .screen.q .home-ind{background:#fff}
[data-skin=night] .body.q{--text:#fff;--sub:rgba(255,255,255,.84);--card:rgba(255,255,255,.18);--soft:rgba(255,255,255,.17);--line:rgba(255,255,255,.32);--accent:#fff;--onacc:#1c1c2e;--ok:#25a863;--bad:#e8435a;--dis:rgba(255,255,255,.22);--distx:rgba(255,255,255,.62)}
[data-skin=night] .body.q .btn{box-shadow:none}
[data-skin=night] .body.q .btn.ghost{border-color:#fff}
[data-skin=night] .body.q .choice.right .res,[data-skin=night] .body.q .choice.wrong .res{color:#fff}
.qtext{font-size:15px;font-weight:700;line-height:1.5}
.code{background:#16181d;color:#e8e6df;border-radius:12px;padding:10px 12px;font:11.5px/1.65 ui-monospace,Menlo,monospace;white-space:pre;overflow:hidden}
.code .ln{display:block;padding:0 4px;margin:0 -4px;border-radius:4px;transition:.25s}
.code .ln.act{background:rgba(255,217,107,.22);box-shadow:inset 3px 0 0 #ffd96b}
.kw{color:#ff8a7a}.ty{color:#7fd0ff}.st{color:#a5e08a}.num{color:#ffd96b}
.choice{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:calc(var(--rc) - 2px);padding:10px 12px;font-weight:600;position:relative}
[data-skin=night] .choice{border-radius:20px}
.choice b{width:22px;height:22px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:11px;flex:none}
.choice .tx{flex:1}
.choice.sel{border-color:var(--accent)}
.choice.sel b{background:var(--accent);color:var(--onacc)}
.choice.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--card))}
.choice.right b{background:var(--ok);color:#fff}
.choice.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--card));animation:shake .4s}
.choice.wrong b{background:var(--bad);color:#fff}
.choice .res{font-weight:800;font-size:12px}
.choice.right .res{color:var(--ok)}.choice.wrong .res{color:var(--bad)}
.choice.mute{opacity:.55}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.fb{position:absolute;left:12px;right:12px;bottom:14px;border-radius:20px;padding:14px;z-index:30;color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.fb.ok{background:var(--ok)}.fb.no{background:var(--bad)}
[data-skin=night][data-mode=dark] .fb.ok,[data-skin=night][data-mode=dark] .fb.no{color:#0d1020}
.fb b{font-size:15px;display:block}
.fb p{font-size:12px;margin-top:4px;line-height:1.5}
.fb .fbbtn{margin-top:10px;background:rgba(255,255,255,.25);border-radius:12px;padding:10px;text-align:center;font-weight:800;font-size:13px}
[data-skin=night][data-mode=dark] .fb .fbbtn{background:rgba(0,0,0,.14)}
.hintbox{background:color-mix(in srgb,#ffd96b 24%,var(--card));border:1px dashed color-mix(in srgb,#e0a526 70%,var(--line));border-radius:var(--rc);padding:9px 12px;font-size:12px;line-height:1.5}
.media{height:92px;border-radius:12px;background:linear-gradient(135deg,#27506f,#17304a);display:grid;place-items:center;font-size:34px;color:#fff;position:relative;overflow:hidden}
.media small{position:absolute;left:8px;bottom:6px;font-size:10px;font-weight:700;opacity:.85}
.media .play{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.88);display:grid;place-items:center;color:#17304a;font-size:16px}
/* 애니메이션 문제 */
.scene{height:104px;border-radius:13px;background:linear-gradient(#17304a,#27506f);position:relative;overflow:hidden;flex:none}
.scene .ground{position:absolute;left:0;right:0;bottom:0;height:26px;background:#dfe9f2;border-radius:50% 50% 0 0/100% 100% 0 0}
.scene .actor{position:absolute;bottom:18px;left:8%;font-size:34px;transition:left 1s ease}
.scene .gift{position:absolute;bottom:18px;right:8%;font-size:28px}
.scene .bubble{position:absolute;top:8px;left:30%;background:#fff;color:#222;border-radius:10px;padding:3px 8px;font-size:11px;font-weight:700}
.vars{display:flex;gap:6px}
.vars span{background:var(--soft);border-radius:8px;padding:3px 8px;font:700 11px ui-monospace,Menlo,monospace}
.playing{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--accent);color:var(--onacc)}
.playing::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;animation:glow 1s infinite}

/* ============ 결과 (S6·S7) ============ */
.ring{width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--ok) 0 var(--p,80%),var(--soft) 0);display:flex;align-items:center;justify-content:center;margin:0 auto;flex:none}
.ring.low{background:conic-gradient(var(--accent) 0 var(--p,60%),var(--soft) 0)}
.ring div{width:76px;height:76px;border-radius:50%;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font-size:22px;line-height:1}
.stats{display:flex;gap:6px}
.stats .card{flex:1;text-align:center;padding:8px 4px}
.stats b{display:block;font-size:14px}
.reward{display:flex;align-items:center;gap:10px;background:var(--hero);color:#f7eedc;border-radius:var(--rc);padding:10px 12px}
.reward .big{font-size:26px}
.reward .sub{color:#d3e4da}
.nightscr{background:var(--night)!important;color:#f7eedc!important}
.nightscr .sub{color:#cfd9ea}
.nightscr .card{background:rgba(255,255,255,.1);border:0;color:#f7eedc}
.nightscr .home-ind{background:#fff}

/* ============ 기록 · 관리 ============ */
.bars{display:flex;align-items:flex-end;gap:6px;height:64px}
.bars div{flex:1;background:var(--accent);border-radius:4px 4px 0 0;position:relative;min-height:3px}
.bars div span{position:absolute;top:-13px;left:0;right:0;text-align:center;font-size:9px;color:var(--sub)}
.axis{display:flex;gap:6px;font-size:9px;color:var(--sub);text-align:center}
.axis span{flex:1}
.wk{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.wk .nm2{width:76px;font-weight:700;font-size:11px;white-space:nowrap}.wk .v{width:30px;text-align:right;font-weight:700;font-size:11px}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.swipe{position:relative;overflow:hidden;border-radius:12px}
.swipe .del{position:absolute;right:0;top:0;bottom:0;width:78px;background:var(--bad);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
.swipe .in{transform:translateX(-78px);background:var(--card);padding:8px 12px;border:1px solid var(--line)}
/* iPad */
.pad{width:820px;height:540px;border-radius:26px;border:12px solid #1b1b1d;background:#1b1b1d;overflow:hidden;box-shadow:0 14px 34px rgba(0,0,0,.28)}
.pad .screen{border-radius:15px;display:flex;flex-direction:column;font-size:12.5px}
.pad .split{flex:1;display:flex;min-height:0;padding-top:26px}
.pad .side{width:270px;border-right:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--tab)}
.pad .main{flex:1;padding:14px 26px;display:flex;flex-direction:column;gap:9px;position:relative}
.pad .padtab{height:46px;border-top:1px solid var(--line);background:var(--tab);display:flex;justify-content:center;gap:70px;padding-top:6px;font-size:10px;color:var(--sub);text-align:center;font-weight:700}
.pad .padtab .on{color:var(--accent)}
.pad .padtab svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block;margin:0 auto 1px}
.sidei{display:flex;gap:10px;align-items:center;padding:8px;border-radius:12px}
.sidei.on{background:var(--soft)}
.pad .status{height:26px;padding-top:4px}
.pb.grow{flex:1}
.nightscr .only-room{display:none!important}
.nightscr .only-night{display:inline!important}
.nightscr .treewrap .cnt{color:#1b2a55;background:#fff}
/* ============ 문서 페이지 공통 ============ */
header.top{position:sticky;top:0;z-index:100;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 28px;background:color-mix(in srgb,var(--page) 90%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--pline)}
header.top h1{font-size:16px;font-weight:800;margin-right:auto}
.tb{border:1px solid var(--pline);background:var(--ppanel);color:var(--pagetext);padding:7px 14px;border-radius:99px;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
.tb.on{background:var(--pagetext);color:var(--page);border-color:var(--pagetext)}
.tbg{display:flex;gap:4px;align-items:center}
.tbg>span{font-size:11.5px;font-weight:700;color:var(--pagesub);margin-right:2px}
main{max-width:1320px;margin:0 auto;padding:28px 28px 90px}
h1.doc{font-size:28px;letter-spacing:-.02em;margin-bottom:6px}
.lead{color:var(--pagesub);font-size:14px;line-height:1.7;max-width:980px}
h2.sec{font-size:20px;margin:48px 0 4px;letter-spacing:-.01em;scroll-margin-top:70px}
.secsub{color:var(--pagesub);font-size:13px;margin-bottom:18px;line-height:1.6}
.panel{background:var(--ppanel);border:1px solid var(--pline);border-radius:16px;padding:18px 22px;font-size:13.5px;line-height:1.75}
.panel h3{font-size:14.5px;margin-bottom:6px}
.panel ul{padding-left:20px}
.panel li{margin:2px 0}
.panel b{color:var(--pagetext)}
.grid{display:flex;flex-wrap:wrap;gap:34px 30px;align-items:flex-start}
figure.f{width:320px}
figure.f figcaption{font-size:12.5px;line-height:1.55;margin-top:12px;color:var(--pagesub)}
figure.f figcaption b{display:block;color:var(--pagetext);font-size:13.5px;margin-bottom:2px}
.id{display:inline-block;background:var(--pbrand);color:#fff;border-radius:6px;padding:1px 7px;font-size:11px;margin-right:6px;font-weight:800}
.demo{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:800;color:#fff;background:#2f8f5b;border-radius:99px;padding:1px 8px}
/* 표 */
table.t{width:100%;border-collapse:collapse;font-size:12.5px;line-height:1.6;background:var(--ppanel);border:1px solid var(--pline);border-radius:12px;overflow:hidden}
table.t th{background:color-mix(in srgb,var(--pagetext) 7%,var(--ppanel));text-align:left;padding:8px 10px;font-weight:800;border-bottom:1px solid var(--pline);white-space:nowrap}
table.t td{padding:8px 10px;border-bottom:1px solid var(--pline);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t td:first-child{white-space:nowrap}
.nn{display:inline-block;min-width:20px;height:20px;line-height:20px;border-radius:10px;background:#e11d48;color:#fff;font-weight:800;font-size:11px;text-align:center;padding:0 5px}
.tag{display:inline-block;font-size:10.5px;font-weight:800;border-radius:6px;padding:1px 7px;margin-right:4px;white-space:nowrap}
.tag.new{background:#fde8c8;color:#8a4b00}
.tag.spec{background:#d9f2e3;color:#14633a}
.tag.mock{background:#dde8ff;color:#27428f}
.tag.ui{background:color-mix(in srgb,var(--pagetext) 10%,transparent);color:var(--pagetext)}
body[data-mode=dark] .tag.new{background:#4a3315;color:#ffd38a}
body[data-mode=dark] .tag.spec{background:#173a27;color:#8fe0b2}
body[data-mode=dark] .tag.mock{background:#1d2a52;color:#a9c0ff}
/* 스와치 */
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sw div{border:1px solid var(--pline);border-radius:12px;overflow:hidden;background:var(--ppanel);font-size:11.5px}
.sw i{display:block;height:44px;border-bottom:1px solid var(--pline)}
.sw span{display:block;padding:6px 9px;line-height:1.4}
.sw code{font-size:10.5px}
/* ====== 화면 설계서 ====== */
.sc{background:var(--ppanel);border:1px solid var(--pline);border-radius:18px;margin:26px 0;overflow:hidden;scroll-margin-top:70px}
.sc-h{display:grid;grid-template-columns:90px 1.1fr 1fr 1.5fr;border-bottom:1px solid var(--pline);font-size:12.5px}
.sc-h>div{padding:10px 14px;border-right:1px solid var(--pline);line-height:1.5}
.sc-h>div:last-child{border-right:0}
.sc-h small{display:block;font-size:10.5px;font-weight:800;color:var(--pagesub);margin-bottom:2px}
.sc-h .nm{font-size:16px;font-weight:800}
.sc-d{padding:12px 18px;font-size:13px;line-height:1.7;border-bottom:1px solid var(--pline);background:color-mix(in srgb,var(--pagetext) 3%,var(--ppanel))}
.fr{display:flex;gap:30px;padding:22px 24px;border-bottom:1px dashed var(--pline);align-items:flex-start}
.fr .ph{flex:none;width:320px}
.fr .ph.pad-w{width:auto}
.fr .cap{font-size:12px;font-weight:800;margin-top:10px;color:var(--pagesub);text-align:center}
.fr .tb2{flex:1;min-width:0}
.fr .tb2 h4,.sc h4.sh{font-size:12.5px;margin:0 0 6px;font-weight:800}
.fr.col{flex-direction:column}
.var{padding:18px 24px;border-bottom:1px dashed var(--pline)}
.var .grid{gap:22px 22px}
.var figure.f{width:320px}
.sc-b{padding:16px 24px 20px;display:grid;grid-template-columns:1.6fr 1fr;gap:22px}
.sc-b.one{grid-template-columns:1fr}
.sc ul.nt{padding-left:18px;font-size:12.5px;line-height:1.7}
.sc ul.nt li{margin:1px 0}
/* 흐름도 */
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 4px;padding:12px 14px;border:1px solid var(--pline);border-radius:12px;background:var(--ppanel);margin-bottom:10px}
.flow .tt{width:100%;font-size:12px;font-weight:800;color:var(--pagesub);margin-bottom:2px}
.nd{display:inline-flex;flex-direction:column;align-items:center;border:1.5px solid var(--pagetext);border-radius:10px;padding:4px 10px;font-weight:800;font-size:12px;line-height:1.3;background:var(--page)}
.nd small{font-weight:600;font-size:10.5px;color:var(--pagesub)}
.nd.dlg{border-style:dashed;border-color:#e11d48}
.ar{font-size:11px;color:var(--pagesub);font-weight:700;padding:0 4px;white-space:nowrap}
.ar::before{content:"─ ";}
.ar::after{content:" ▶";color:var(--pagetext)}
.toc{display:flex;flex-wrap:wrap;gap:6px}
.toc a{font-size:12px;font-weight:700;padding:5px 11px;border:1px solid var(--pline);border-radius:99px;color:var(--pagetext);text-decoration:none;background:var(--ppanel)}
.nomk-note{font-size:12px;color:var(--pagesub)}
@media print{header.top{position:static}.sc{break-inside:avoid-page}}

</style>
</head>
<body data-skin="night" data-mode="light">
<div id="app"></div>
<script>
/* ================================================================
   산타의 작업실 탈출 · 화면 라이브러리
   - 모든 화면은 스킨(room / night)과 모드(light / dark)를 CSS 토큰으로만 구분합니다.
   - mk(n)은 화면 설계서에서만 보이는 번호 마커입니다.
   ================================================================ */
const mk=(n,c='')=>n?`<i class="mk ${c}">${n}</i>`:'';
const ico={
 home:'<svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>',
 chart:'<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
 list:'<svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>'
};
const TABS=[['home','작업'],['chart','기록'],['list','관리']];
const tabbar=(a,m)=>`<div class="tabbar">${TABS.map(([k,n],i)=>`<div class="${i===a?'on':''}">${ico[k]}${n}${i===a?mk(m):''}</div>`).join('')}</div>`;

const CATS=[
 {k:'ai',task:'소원 접수',cat:'AI 활용',e:'📮',col:'#e0556a',acc:72},
 {k:'swift',task:'선물 생산',cat:'Swift 문법',e:'🎁',col:'#f2a93b',acc:54},
 {k:'hig',task:'포장',cat:'HIG',e:'🎀',col:'#2fae78',acc:81},
 {k:'ui',task:'썰매 적재',cat:'SwiftUI 실전',e:'🛷',col:'#4a8fe0',acc:66}
];

function phone(inner,o={}){
 const q=o.q?'q ':'';
 const st=o.q?` style="--oc:${o.q}"`:'';
 return `<div class="phone"><div class="screen ${q}${o.night?'nightscr':''}"${st}><div class="island"></div><div class="status"><span>9:41</span><span>●●● ▮</span></div><div class="body ${q}${o.tab!=null?'wt':''} ${o.cls||''}">${inner}</div>${o.over||''}${o.tab!=null?tabbar(o.tab,o.tm):''}<div class="home-ind"></div></div></div>`;
}

/* ---------- 트리 ---------- */
const SLOTS=[[110,62],[98,92],[122,92],[88,120],[110,120],[132,120],[80,148],[110,148],[140,148],[70,176],[110,176],[150,176]];
const ORN=['#ff4d4d','#ffd23f','#4da3ff','#ff8be0','#8ce3a6','#ffb15c'];
const LIGHTS=[[104,76],[117,76],[89,106],[131,106],[99,134],[121,134],[75,162],[95,162],[125,162],[145,162]];
function treeBox(n,o={}){
 const orn=SLOTS.map((p,i)=>i<n
  ?`<g class="orng" style="--c:${ORN[i%6]}"><circle cx="${p[0]}" cy="${p[1]}" r="7" fill="${ORN[i%6]}" stroke="#fff" stroke-width="1.5"/><circle cx="${p[0]-2}" cy="${p[1]-2}" r="1.8" fill="#fff" opacity=".8"/></g>`
  :`<circle cx="${p[0]}" cy="${p[1]}" r="6" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="1.5" stroke-dasharray="3 3"/>`).join('');
 const lights=LIGHTS.map((p,i)=>`<circle class="glow" style="animation-delay:${(i%5)*.35}s" cx="${p[0]}" cy="${p[1]}" r="2.2" fill="#fff6b0"/>`).join('');
 const stars=[[18,20],[196,26],[40,60],[184,70],[26,110],[200,118],[60,30],[160,16]].map((p,i)=>`<circle class="nstar glow" style="animation-delay:${i*.4}s" cx="${p[0]}" cy="${p[1]}" r="${1+(i%3)*.5}"/>`).join('');
 const room=`<g class="only-room"><rect y="170" width="220" height="44" style="fill:var(--floor)"/><rect x="8" y="30" width="44" height="50" rx="3" style="fill:var(--win)" stroke="#8b5e3c" stroke-width="3"/><path d="M30 30v50M8 55h44" stroke="#8b5e3c" stroke-width="2"/><g class="snow" fill="#fff"><circle cx="16" cy="34" r="2"/><circle cx="30" cy="32" r="1.6" style="animation-delay:1s"/><circle cx="43" cy="34" r="2" style="animation-delay:2s"/></g></g>`;
 const night=`<g class="only-night">${stars}<ellipse class="ground-n" cx="110" cy="206" rx="104" ry="11"/></g>`;
 const svg=`<svg viewBox="0 0 220 214" preserveAspectRatio="xMidYMax meet">${room}${night}
 <ellipse cx="110" cy="206" rx="70" ry="6" fill="#000" opacity=".12" class="only-room"/>
 <polygon class="t3" points="110,34 76,98 144,98"/><polygon class="t2" points="110,62 60,140 160,140"/><polygon class="t1" points="110,96 46,184 174,184"/>
 <rect class="trunk" x="100" y="184" width="20" height="20" rx="2"/>
 <g class="only-night">${lights}</g>
 <polygon points="110,14 114,25 126,25 116,32 120,44 110,37 100,44 104,32 94,25 106,25" fill="var(--star)"/>${orn}</svg>`;
 return `<div class="treewrap">${svg}<div class="cnt ${o.cl||''}">🎄 ${n} / 12${mk(o.mc,'rt')}</div>${mk(o.m)}</div>`;
}

/* ---------- 데이터 ---------- */
const LV=[{k:'easy',n:'쉬움',left:8,total:20},{k:'mid',n:'보통',left:14,total:20},{k:'hard',n:'어려움',left:18,total:20}];
const COL={easy:'var(--easy)',mid:'var(--mid)',hard:'var(--hard)'};
const tiles=(m)=>`<div class="h2">아직 안 푼 문제 <small>총 ${LV.reduce((a,l)=>a+l.left,0)}문제</small></div><div class="tiles">${LV.map(l=>`<div class="tile"><span class="badge b-${l.k}">${l.n}</span><b>${l.left}</b><span class="sub">/ ${l.total}문제</span><div class="bar"><i style="width:${(l.total-l.left)/l.total*100}%;background:${COL[l.k]}"></i></div></div>`).join('')}${mk(m)}</div>`;

/* ================================================================
   S1 작업 메인
   o.n 장식 수, o.resume 이어서 풀기, o.dim(오버레이 아래 깔기), o.over
   ================================================================ */
function S1body(o={}){
 const n=o.n??7, left=12-n, m=o.m;
 const mm=(k)=>m===4?(k===4?4:0):(m?k:0);
 const sub=o.treeNo||'크리스마스 · 1번째 트리';
 const leftTx=n===0?`첫 장식을 얻어 트리를 꾸며 보세요`:`트리를 완성하려면 장식 <b>${left}개</b>가 남았어요`;
 const resume=o.resume?`<div class="resume">${mk(mm(4))}<div class="ico">🎁</div><div class="grow"><div class="k">이어서 풀기</div><div class="sub">선물 생산 · 보통 · 6 / 10 문제</div></div><span style="color:var(--accent);font-weight:800;font-size:18px">›</span></div>`:'';
 return `<div class="hd"><div class="hdn"><div class="title sm">산타의 작업실${mk(mm(1))}</div><small>${sub}</small></div><div class="pillbtn">🎁 보관함${mk(mm(2),'rt')}</div></div>
 ${treeBox(n,{m:mm(3)})}
 <p class="left">${leftTx}${mk(mm(5),'rt')}</p>
 ${resume}
 <div class="btn">오늘의 출제${mk(mm(6))}</div>
 <div class="link">작업 직접 고르기 ›${mk(mm(7))}</div>
 <div style="margin-top:2px">${tiles(mm(8))}</div>`;
}
const S1=(o={})=>phone(S1body(o),{tab:0,tm:o.m?9:0,over:o.over,cls:o.cls});

/* S1 진행 중 세션 선택 시트 / 새로 시작 확인 알림 */
const S1_sheet=(m)=>S1({n:7,resume:true,over:`<div class="dimbg"></div><div class="sheet"><div class="grab"></div>
 <div class="title sm" style="font-size:17px">진행 중인 세션이 있어요${mk(m&&1)}</div>
 <div class="card row">${mk(m&&2)}<div class="ico">🎁</div><div class="grow"><div class="k">선물 생산 · 보통</div><div class="sub">6 / 10 문제까지 풀었어요</div></div></div>
 <div class="btn">이어서 풀기${mk(m&&3)}</div><div class="btn ghost">새로 시작${mk(m&&4)}</div></div>`});
const S1_alert=(m)=>S1({n:7,resume:true,over:`<div class="dimbg"></div><div class="alert"><h4>새로 시작할까요?${mk(m&&1)}</h4><p>진행 중이던 세션(선물 생산 · 6/10)은<br>이어서 풀 수 없게 돼요.</p><div class="ab"><span>취소${mk(m&&2)}</span><span class="b d">새로 시작${mk(m&&3)}</span></div></div>`});

/* ================================================================
   S2 작업 선택
   ================================================================ */
function S2body(o={}){
 const m=o.m, nodata=o.nodata;
 const card=(c,i)=>{
  const rec=nodata?i===0:i===1;
  const acc=nodata?'아직 기록 없음':`정답률 ${c.acc}%`;
  return `<div class="tcard ${rec?'rec':''} ${nodata?'nodata':''}" style="--cc:${c.col}">${mk(m&&(rec?3:4))}<div class="ico">${c.e}</div><div class="grow"><div class="k">${c.task} ${rec?`<span class="chip red">추천</span>`:''}</div><div class="sub">${c.cat} · ${acc}</div><div class="pb" style="margin-top:5px"><i style="width:${nodata?0:c.acc}%"></i>${i===0&&m?mk(5):''}</div></div></div>`};
 return `<div class="nav"><span class="l">‹ 작업${mk(m&&1)}</span><span class="t"></span><span class="r"></span></div>
 <div><div class="title">작업 선택${mk(m&&2)}</div><div class="sub" style="margin-top:3px">오늘 어떤 작업을 도울까요?</div></div>
 ${CATS.map(card).join('')}
 <div class="sub" style="text-align:center">${nodata?'기록이 없을 때는 첫 번째 작업을 추천해요':'추천은 최근 정답률과 자주 푼 주제를 조합해 정해요'}${mk(m&&6,'rt')}</div>`;
}
const S2=(o={})=>phone(S2body(o),{tab:0,tm:o.m?8:0,over:o.over});

/* ================================================================

function wireQuizDemo(root){
 const cs=[...root.querySelectorAll('.choice')],btn=root.querySelector('.btn'),fb=root.querySelector('.fb');
 if(!cs.length||!btn)return;
 let sel=-1,done=false;const RIGHT=1;
 const reset=()=>{done=false;sel=-1;cs.forEach(x=>{x.className='choice';const r=x.querySelector('.res');if(r)r.textContent=''});fb.style.display='none';btn.style.display='';btn.textContent='확인';btn.classList.add('off')};
 cs.forEach((c,i)=>c.style.cursor='pointer',0);
 cs.forEach((c,i)=>c.onclick=()=>{if(done){reset();return}sel=i;cs.forEach(x=>x.classList.toggle('sel',x===c));btn.classList.remove('off')});
 btn.style.cursor='pointer';
 btn.onclick=()=>{if(sel<0||done)return;done=true;const ok=sel===RIGHT;
  cs.forEach((x,i)=>{x.classList.remove('sel');if(i===RIGHT){x.classList.add('right');x.querySelector('.res').textContent='✓ 정답'}else if(i===sel){x.classList.add('wrong');x.querySelector('.res').textContent='✕ 오답'}else x.classList.add('mute')});
  fb.className='fb '+(ok?'ok':'no');fb.style.display='block';fb.querySelector('b').textContent=ok?'✓ 정답이에요!':'✕ 아쉬워요';btn.style.display='none'};
 fb.style.cursor='pointer';fb.onclick=reset;
}
function wireTrace(root){

 if(!lines.length)return;
 const steps=[{l:0,x:'8%',b:'gifts = 3',v:'조건 = …',n:'1번째 줄: gifts는 3으로 설정됩니다'},{l:1,x:'30%',b:'3 > 3 ?',v:'조건 = …',n:'2번째 줄: 3 > 3 인지 확인합니다'},{l:1,x:'30%',b:'false',v:'조건 = false',n:'2번째 줄: 3은 3보다 크지 않아서 거짓입니다'},{l:2,x:'30%',b:'기다려요',v:'조건 = false',n:'3번째 줄: 조건이 거짓이라 else로 들어가 산타가 기다립니다'},{l:3,x:'8%',b:'return',v:'조건 = false',n:'4번째 줄: return으로 함수가 끝납니다. 배달은 하지 않아요'}];
 let i=0;const play=()=>{const s=steps[i];lines.forEach((e,k)=>e.classList.toggle('act',k===s.l));actor.style.left=s.x;bubble.textContent=s.b;v2.textContent=s.v;narr.childNodes[0].nodeValue=s.n;i=(i+1)%steps.length};

}

function drawTokens(){
 const el=document.querySelector('.screen');if(!el)return;
 const cs=getComputedStyle(el);
 const T=[['--bg','배경'],['--card','카드'],['--text','본문 글자'],['--sub','보조 글자'],['--accent','강조(버튼)'],['--onacc','강조 위 글자'],['--ok','정답'],['--bad','오답'],['--line','경계선'],['--soft','옅은 면'],['--easy','쉬움'],['--mid','보통'],['--hard','어려움'],['--t1','트리 연한 면'],['--t3','트리 진한 면']];
 document.getElementById('sw').innerHTML=T.map(([v,n])=>{const val=cs.getPropertyValue(v).trim();return `<div><i style="background:${val}"></i><span><b>${n}</b><br><code>${v}</code> ${val.startsWith('linear')?'그라데이션':val}</span></div>`}).join('');
 const m=document.getElementById('curmode');if(m)m.textContent=document.body.dataset.mode==='dark'?'다크':'라이트';
}
function initPage(skin){
 document.body.dataset.skin=skin;
 const root=document.body;
 function setMode(m){
  const eff=m==='auto'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):m;
  root.dataset.mode=eff;
  document.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  drawTokens();
 }
 document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
 setMode('auto');
}
buildManual('night');initPage('night');
document.querySelectorAll('.nomk').forEach(e=>e);
document.body.classList.add('nomk');
document.querySelectorAll('figure .demo').forEach(d=>{const p=d.closest('figure').querySelector('.phone');if(p.querySelector('#trace2'))wireTrace(p);else wireQuizDemo(p)});
</script>
