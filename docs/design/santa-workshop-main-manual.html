<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>산타의 작업실 탈출 · 디자인 매뉴얼 · 작업실 시안</title>
<style>
/* ============ 페이지 공통 ============ */
:root{--page:#eceef2;--pagetext:#14161a;--pagesub:#5b6270;--pline:#d9dce3;--ppanel:#fff;--pbrand:#c8382b}
body[data-mode=dark]{--page:#0d0e11;--pagetext:#f2f3f5;--pagesub:#9aa1ae;--pline:#2a2d35;--ppanel:#171a20}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif;background:var(--page);color:var(--pagetext);transition:background .3s}
code{font-family:ui-monospace,Menlo,monospace;font-size:.92em;background:color-mix(in srgb,var(--pagetext) 8%,transparent);padding:1px 5px;border-radius:5px}

/* ============ 스킨 토큰 (room = 작업실 / night = 나이트 글로우) ============ */
[data-skin=room] .screen{--bg:#fbf3e6;--card:#fffdf8;--text:#2b1a14;--sub:#8c6f62;--accent:#c8382b;--onacc:#fff;--ok:#2f8f5b;--bad:#d64545;--line:#ecdcc6;--soft:#f6ead6;--tab:#fffaf0;--wall:#f4dfc0;--floor:#c99d6b;--win:#bfe3ff;--easy:#2f8f5b;--mid:#d98a1c;--hard:#c8382b;--dis:#d9cfc0;--distx:#8f7f6e;--rc:14px;--rb:14px;--t1:#2fa86a;--t2:#26905a;--t3:#1f7a46;--trunk:#7a4a2b;--star:#ffd23f;--night:linear-gradient(#17304a,#0b1a2b);--hero:linear-gradient(135deg,#1b6b42,#0f432b)}
[data-skin=room][data-mode=dark] .screen{--bg:#0c1a14;--card:#14271e;--text:#f7eedc;--sub:#9fb5a7;--accent:#ff6a5c;--onacc:#2a0b07;--ok:#4ed08a;--bad:#ff7a7a;--line:#254036;--soft:#1a3026;--tab:#0f2019;--wall:#16291f;--floor:#3b2a1c;--win:#0b2b4e;--easy:#4ed08a;--mid:#f0b04a;--hard:#ff6a5c;--dis:#2a3b33;--distx:#7d9285;--hero:linear-gradient(135deg,#1f7a4c,#0f3b27)}
[data-skin=night] .screen{--bg:linear-gradient(#cfe0ff,#f6f9ff 72%);--card:#fff;--text:#1b2a55;--sub:#556493;--accent:#d04616;--onacc:#fff;--ok:#1f9d63;--bad:#d93a54;--line:#d5def5;--soft:#eaf0ff;--tab:rgba(255,255,255,.86);--easy:#1f9d63;--mid:#b86e00;--hard:#d93a54;--dis:#d5def5;--distx:#7683ad;--rc:20px;--rb:999px;--t1:#2f9a8a;--t2:#25857a;--t3:#1c6f68;--trunk:#6b4a3a;--star:#ffd23f;--night:linear-gradient(#17304a,#0b1a2b);--hero:linear-gradient(135deg,#2a3a8c,#171f5c)}
[data-skin=night][data-mode=dark] .screen{--bg:linear-gradient(#070a22,#1b2158 82%);--card:#151a42;--text:#f2f4ff;--sub:#a3aedd;--accent:#ffd96b;--onacc:#3a2600;--ok:#35d38d;--bad:#ff6b81;--line:#2d3570;--soft:#1f2557;--tab:rgba(14,18,52,.9);--easy:#35d38d;--mid:#ffb020;--hard:#ff6b81;--dis:#2d3570;--distx:#7783b8;--t1:#1f6f64;--t2:#17594f;--t3:#10463f;--trunk:#4a3226}
/* 겹쳐 뜨는 패널(시트·알림·토스트)은 퀴즈 화면의 색 재정의와 상관없이 기본 색을 씁니다 */
.screen{--pc:var(--card);--pt:var(--text);--ps:var(--sub);--pl:var(--line);--pa:var(--accent);--pbad:var(--bad);--psoft:var(--soft)}

/* ============ iPhone 프레임 ============ */
.phone{width:320px;height:700px;border-radius:44px;background:#000;padding:8px;box-shadow:0 20px 50px rgba(0,0,0,.28);flex:none}
.screen{position:relative;width:100%;height:100%;border-radius:36px;overflow:hidden;background:var(--bg);color:var(--text);font-size:13px;line-height:1.4}
.screen :where(*:has(>.mk)){position:relative}
.island{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:80px;height:22px;background:#000;border-radius:20px;z-index:60}
.status{position:absolute;top:0;left:0;right:0;height:38px;display:flex;justify-content:space-between;align-items:center;padding:6px 24px 0;font-size:12px;font-weight:700;z-index:55}
.body{position:absolute;inset:0;padding:48px 20px 34px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.body.wt{padding-bottom:88px}
.body.center{justify-content:center}
.home-ind{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:100px;height:4px;border-radius:4px;background:var(--text);opacity:.8;z-index:58}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:78px;background:var(--tab);border-top:1px solid var(--line);display:flex;padding:8px 6px 0;z-index:7;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.tabbar div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:700;color:var(--sub)}
.tabbar div.on{color:var(--accent)}
.tabbar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ============ 번호 마커 (화면 설계서에서만 표시) ============ */
.mk{position:absolute;left:-7px;top:-7px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:#e11d48;color:#fff;font:800 10px/18px -apple-system,sans-serif;text-align:center;font-style:normal;z-index:70;box-shadow:0 0 0 2px #fff;pointer-events:none;letter-spacing:0;text-shadow:none}
.mk.rt{left:auto;right:-7px}
.mk.in{left:-14px;top:0}
.nomk .mk{display:none}

/* ============ 공통 컴포넌트 ============ */
.nav{display:flex;align-items:center;justify-content:space-between;min-height:30px;font-weight:700;gap:8px}
.nav .t{font-size:14px;text-align:center;flex:1}
.nav .l,.nav .r{font-size:13px;color:var(--accent);font-weight:700;min-width:64px;white-space:nowrap}
.nav .r{text-align:right}
.xbtn{width:30px;height:30px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--text);font-size:13px;font-weight:800;flex:none}
.title{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.title.sm{font-size:20px}
.sub{color:var(--sub);font-size:11.5px}
.k{font-weight:700}
.sp{flex:1}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rc);padding:10px 12px}
.card.soft{background:var(--soft);border-color:transparent}
.card.acc{border-color:var(--accent);border-width:1.5px}
.btn{display:block;text-align:center;padding:14px;border-radius:var(--rb);background:var(--accent);color:var(--onacc);font-weight:800;font-size:15px;box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 60%,#000);line-height:1.2}
[data-skin=night] .btn{box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 32%,transparent)}
.btn.ghost{background:transparent;color:var(--accent);box-shadow:none;border:2px solid var(--accent);padding:12px}
.btn.off{background:var(--dis);color:var(--distx);box-shadow:none}
.btn.bad{background:var(--bad);color:#fff}
.btn.sm{padding:10px;font-size:13px}
.btn.gold{background:#ffd96b;color:#4a2a00;box-shadow:0 4px 0 #c9a43a}
.link{text-align:center;color:var(--accent);font-weight:800;font-size:13px;padding:2px 0}
.chip{display:inline-block;border-radius:999px;padding:2px 9px;font-size:10.5px;font-weight:700;background:var(--soft);color:var(--sub);margin-right:4px;white-space:nowrap}
.chip.red{background:var(--accent);color:var(--onacc)}
.chip.grn{background:var(--ok);color:#fff}
.chip.dis{background:var(--dis);color:var(--distx)}
.chip.bad{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.badge{display:inline-block;font-size:10px;font-weight:800;padding:2px 8px;border-radius:99px;color:#fff}
.b-easy{background:var(--easy)}.b-mid{background:var(--mid)}.b-hard{background:var(--hard)}
.pb{height:6px;border-radius:6px;background:var(--soft);overflow:hidden;flex:none}
.pb i{display:block;height:100%;border-radius:6px;background:var(--accent)}
.pb.g i{background:var(--ok)}
.ico{width:38px;height:38px;border-radius:11px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.seg{display:flex;background:var(--soft);border-radius:var(--rb);padding:3px;gap:3px}
.seg span{flex:1;text-align:center;padding:7px 0;border-radius:var(--rb);font-weight:700;font-size:12px;color:var(--sub)}
.seg span.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.toggle{width:40px;height:24px;border-radius:12px;background:var(--ok);position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:#fff}
.toggle.off{background:var(--dis)}.toggle.off::after{right:auto;left:2px}
.item{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.x{color:var(--bad);font-weight:800}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;padding:0 6px}
.empty .big{font-size:38px}
.field{background:var(--card);border:1px solid var(--line);border-radius:var(--rc);padding:9px 12px;color:var(--sub)}
.field.err{border-color:var(--bad);border-width:1.5px}
.errtx{color:var(--bad);font-size:11px;font-weight:700;margin-top:4px}
.dim{opacity:.55}

/* ============ 트리 ============ */
.treewrap{position:relative;border-radius:22px;overflow:hidden;flex:1;min-height:0;display:flex;align-items:flex-end;justify-content:center}
[data-skin=room] .treewrap{background:var(--wall)}
[data-skin=night][data-mode=dark] .treewrap{background:radial-gradient(ellipse at 50% 78%,rgba(255,224,130,.16),transparent 62%)}
.treewrap svg{width:100%;height:100%;display:block}
.treewrap .cnt{position:absolute;top:10px;right:10px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-weight:800;font-size:11px;z-index:2}
.treewrap .cnt.l{right:auto;left:10px}
[data-skin=room] .only-night,[data-skin=night] .only-room{display:none}
.t1{fill:var(--t1)}.t2{fill:var(--t2)}.t3{fill:var(--t3)}.trunk{fill:var(--trunk)}
.snow circle{animation:snow 4s linear infinite}
@keyframes snow{from{transform:translateY(-6px);opacity:0}30%{opacity:1}to{transform:translateY(34px);opacity:0}}
.glow{animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{opacity:.4}}
[data-skin=night] .orng{filter:drop-shadow(0 0 4px var(--c))}
.nstar{fill:#fff;opacity:.85}
[data-skin=night]:not([data-mode=dark]) .nstar{fill:#8fa6e8;opacity:.6}
.ground-n{fill:#fff;opacity:.9}
[data-skin=night][data-mode=dark] .ground-n{fill:#aeb8f0;opacity:.35}

/* ============ S1 ============ */
.hd{display:flex;align-items:center;gap:8px}
.hd .hdn{flex:1}
.hd .hdn small{display:block;color:var(--sub);font-size:11px;font-weight:600;margin-top:1px}
.left{text-align:center;font-size:13px;color:var(--sub)}
.left b{color:var(--accent);font-size:15px}
.h2{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:14px;margin:0 2px}
.h2 small{font-weight:600;font-size:11px;color:var(--sub)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--rc);padding:8px 4px;text-align:center}
.tile b{display:block;font-size:20px;line-height:1.15;margin:3px 0 0}
.tile .bar{height:5px;border-radius:5px;background:var(--soft);overflow:hidden;margin:6px 8px 0}
.tile .bar i{display:block;height:100%}
.resume{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1.5px solid var(--accent);border-radius:var(--rc);background:var(--card)}

/* ============ S2 출제 (필터) ============ */
.fh{font-size:12px;font-weight:800;color:var(--sub);margin:2px 2px -4px;position:relative}
.fh small{font-weight:600}
.segd{display:flex;gap:6px}
.segd>div{flex:1;border:2px solid var(--line);background:var(--card);border-radius:var(--rc);padding:7px 0 6px;text-align:center;display:flex;flex-direction:column;gap:1px;font-weight:800;font-size:14px}
.segd .st{font-size:11px;color:var(--c);line-height:1.2}
.segd small{font-size:9.5px;color:var(--sub);font-weight:700}
.segd>div.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--soft))}
.cgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 7px}
.cgrid>div{position:relative;display:flex;align-items:center;gap:4px;min-width:0;border:2px solid var(--line);background:var(--card);border-radius:var(--rc);padding:9px 6px}
.cgrid i{font-style:normal;font-size:16px}
.cgrid span{display:flex;flex-direction:column;line-height:1.25;min-width:0;flex:1}
.cgrid b{font-size:11.5px;white-space:nowrap;letter-spacing:-.3px}
.cgrid small{font-size:10px;color:var(--sub);font-weight:600;white-space:nowrap}
.cgrid u{margin-left:auto;text-decoration:none;width:16px;height:16px;flex:none;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:11px;color:transparent}
.cgrid>div.on{border-color:var(--cc);background:color-mix(in srgb,var(--cc) 16%,var(--soft))}
.cgrid>div.on u{background:var(--cc);border-color:var(--cc);color:#fff}
.cgrid em.rec{position:absolute;top:-8px;right:8px;font-style:normal;font-size:9px;font-weight:800;padding:1px 7px;border-radius:99px;background:var(--accent);color:var(--onacc)}
.qseg{display:flex;gap:6px;padding:4px;border-radius:var(--rc);background:var(--soft);border:1px solid var(--line)}
.qseg>div{flex:1;text-align:center;font-weight:800;font-size:16px;padding:7px 0;border-radius:calc(var(--rc) - 4px);color:var(--sub);position:relative}
.qseg>div.on{background:var(--accent);color:var(--onacc)}
.qseg>div.lock{opacity:.5}
.qseg>div.lock::after{content:"🔒";font-size:9px;position:absolute;top:2px;right:5px}
.sx{font-size:11.5px;color:var(--sub);font-weight:600;line-height:1.5}
.sx b{color:var(--text)}
/* ===== 출제 영역 전용 색 (santa-workshop-v3.html 시안 1 팔레트) ===== */
[data-skin=room] .screen.v3{--bg:linear-gradient(#cfe0ff,#f6f9ff 72%);--card:#fff;--text:#1b2a55;--sub:#5b6a99;--accent:#e0541f;--onacc:#fff;--ok:#1f9d63;--bad:#e0405a;--line:#d5def5;--soft:#eaf0ff;--tab:rgba(255,255,255,.82);--wall:linear-gradient(#cfe0ff,#f6f9ff 72%);--floor:#eaf0ff;--win:#cfe0ff;--easy:#5be3a0;--mid:#ffb020;--hard:#ff5d73;--dis:#d5def5;--distx:#5b6a99;--t1:#2f9a8a;--t2:#25857a;--t3:#1c6f68;--trunk:#6b4a3a}
[data-skin=room][data-mode=dark] .screen.v3{--bg:linear-gradient(#070a22,#1b2158 82%);--card:#151a42;--text:#f2f4ff;--sub:#9aa6d8;--accent:#ffd96b;--onacc:#3a2600;--ok:#35d38d;--bad:#ff6b81;--line:#2d3570;--soft:#1f2557;--tab:rgba(14,18,52,.88);--wall:linear-gradient(#070a22,#1b2158 82%);--floor:#1f2557;--win:#1b2158;--dis:#2d3570;--distx:#9aa6d8;--t1:#1f6f64;--t2:#17594f;--t3:#10463f;--trunk:#4a3226}
.vback{display:flex;flex-direction:column;gap:10px;flex:1;min-height:0;-webkit-filter:blur(7px);filter:blur(7px)}
.dimbg.b{z-index:29;background:rgba(10,14,40,.45)}
.screen.v3 .dimbg{-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.vh{display:flex;justify-content:space-between;align-items:flex-start}
.vh .hl,.vh .hr2{display:flex;flex-direction:column;gap:6px}
.vh .hl{align-items:flex-start}.vh .hr2{align-items:flex-end}
.vht{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.vpill{font-size:11px;font-weight:800;padding:5px 10px;border-radius:99px;background:var(--accent);color:var(--onacc);position:relative}
.vhint{text-align:center;font-size:12.5px;font-weight:700;color:var(--sub);position:relative}
.vhint.sm{font-size:11px}
.vleg{display:flex;justify-content:center;gap:12px;font-size:10.5px;font-weight:800;color:var(--sub);align-items:center;position:relative}
.vleg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;background:var(--pp);vertical-align:-1px}
.vleg em{font-style:normal;opacity:.8}
.vsnow circle{fill:#fff;animation:vsn 7s linear infinite}
@keyframes vsn{0%{transform:translateY(-10px);opacity:0}15%{opacity:.9}100%{transform:translateY(560px);opacity:0}}
.vlt circle{fill:#ffe58a;animation:vtw 2.2s infinite}.vlt circle:nth-child(3n){animation-delay:-.7s;fill:#ff9fb4}.vlt circle:nth-child(3n+1){animation-delay:-1.4s;fill:#9fe4ff}
@keyframes vtw{50%{opacity:.25}}
.vorn .ob{fill:var(--oc);filter:drop-shadow(0 0 9px var(--oc));opacity:.8}
.vorn.lit .ob{filter:drop-shadow(0 0 22px var(--oc));opacity:1}
.vorn .gl{fill:#fff;opacity:.45}
.vorn text{text-anchor:middle;fill:#fff;font-weight:800}
.vorn .vn{font-size:15.5px;letter-spacing:-.2px}
.vorn .cap{fill:#d9b44a}
.vorn .ck{opacity:0}.vorn.lit .ck{opacity:1}
.vorn .ck circle{fill:#fff;stroke:var(--oc);stroke-width:2.5}.vorn .ck text{fill:var(--oc);font-size:15px}
.vorn.off{opacity:.3}
.vbob{animation:vbob 3.2s ease-in-out infinite}
.vorn:nth-of-type(2n) .vbob{animation-delay:-1.4s}
@keyframes vbob{50%{transform:translateY(-4px)}}
.vpip{fill:none;stroke:var(--pp);stroke-width:2.2}
.vpip.on{fill:var(--pp);filter:drop-shadow(0 0 4px var(--pp))}
.setchip{font-size:11px;font-weight:800;padding:6px 11px;border-radius:99px;background:var(--card);border:1px solid var(--line);white-space:nowrap;position:relative}
.setchip.act{background:var(--accent);color:var(--onacc);border-color:transparent}
.vpill.mute{background:var(--card);color:inherit;border:1px solid var(--line)}
.otree{flex:1;min-height:0;position:relative}
.setup{position:absolute;left:14px;right:14px;top:50%;transform:translateY(-50%);z-index:30;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:26px;padding:16px 14px 14px;box-shadow:0 20px 60px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:7px}
.setup.static{position:relative;left:auto;right:auto;top:auto;transform:none;box-shadow:0 6px 24px rgba(0,0,0,.12)}
.setup .segd>div,.setup .cgrid>div{background:var(--soft)}
.setup .segd>div.on{background:color-mix(in srgb,var(--accent) 12%,var(--soft))}
.setup .cgrid>div.on{background:color-mix(in srgb,var(--cc) 16%,var(--soft))}
.setup .qseg{background:var(--soft)}

/* ============ 시트 · 팝업 · 알림 · 토스트 ============ */
.dimbg{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:40}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:41;background:var(--pc);color:var(--pt);border-radius:24px 24px 0 0;padding:10px 18px 26px;display:flex;flex-direction:column;gap:9px;--card:var(--pc);--text:var(--pt);--sub:var(--ps);--line:var(--pl);--soft:var(--psoft);--accent:var(--pa)}
.sheet .grab{width:38px;height:4px;border-radius:3px;background:var(--pl);margin:0 auto 2px}
[data-skin=night] .sheet{left:14px;right:14px;bottom:auto;top:50%;transform:translateY(-50%);border-radius:28px;padding:18px 16px 16px;box-shadow:0 20px 60px rgba(0,0,0,.35);border:1px solid var(--pl)}
[data-skin=night] .sheet .grab{display:none}
.sheet h3,.sheet .h3{font-size:12px;color:var(--ps);font-weight:800;margin-top:2px}
.sheet h3 small,.h3 small{font-weight:600}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.opt{border:2px solid var(--line);background:var(--soft);border-radius:calc(var(--rc) - 2px);padding:8px 4px;text-align:center;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}

<body data-skin="room" data-mode="light">
<div id="app"></div>
<script>
/* ================================================================
   산타의 작업실 탈출 · 화면 라이브러리
   - 모든 화면은 스킨(room / night)과 모드(light / dark)를 CSS 토큰으로만 구분합니다.
   - mk(n)은 화면 설계서에서만 보이는 번호 마커입니다.
   ================================================================ */
const mk=(n,c='')=>n?`<i class="mk ${c}">${n}</i>`:'';
const ico={
 home:'<svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>',
 chart:'<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
 list:'<svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
 quiz:'<svg viewBox="0 0 24 24"><path d="M10 6h11M10 12h11M10 18h11M3 6l1.5 1.5L7 4.5M3 12l1.5 1.5L7 10.5M3 18l1.5 1.5L7 16.5"/></svg>'
};
const TABS=[['home','작업실'],['quiz','출제'],['chart','기록'],['list','관리']];
const tabbar=(a,m)=>`<div class="tabbar">${TABS.map(([k,n],i)=>`<div class="${i===a?'on':''}">${ico[k]}${n}${i===a?mk(m):''}</div>`).join('')}</div>`;

const CATS=[
 {k:'ai',task:'소원 접수',cat:'AI 활용',e:'📮',col:'#e0556a',acc:72},
 {k:'swift',task:'선물 생산',cat:'Swift 문법',e:'🎁',col:'#f2a93b',acc:54},
 {k:'hig',task:'포장',cat:'HIG',e:'🎀',col:'#2fae78',acc:81},
 {k:'ui',task:'썰매 적재',cat:'SwiftUI 실전',e:'🛷',col:'#4a8fe0',acc:66}
];

function phone(inner,o={}){
 const q=o.q?'q ':'';
 const st=o.q?` style="--oc:${o.q}"`:'';
 return `<div class="phone"><div class="screen ${q}${o.night?'nightscr':''}${o.v3?' v3':''}"${st}><div class="island"></div><div class="status"><span>9:41</span><span>●●● ▮</span></div><div class="body ${q}${o.tab!=null?'wt':''} ${o.cls||''}">${inner}</div>${o.over||''}${o.tab!=null?tabbar(o.tab,o.tm):''}<div class="home-ind"></div></div></div>`;
}

/* ---------- 트리 ---------- */
const SLOTS=[[110,62],[98,92],[122,92],[88,120],[110,120],[132,120],[80,148],[110,148],[140,148],[70,176],[110,176],[150,176]];
const ORN=['#ff4d4d','#ffd23f','#4da3ff','#ff8be0','#8ce3a6','#ffb15c'];
const LIGHTS=[[104,76],[117,76],[89,106],[131,106],[99,134],[121,134],[75,162],[95,162],[125,162],[145,162]];
function treeBox(n,o={}){
 const orn=SLOTS.map((p,i)=>i<n

function wireQuizDemo(root){
 const cs=[...root.querySelectorAll('.choice')],btn=root.querySelector('.btn'),fb=root.querySelector('.fb');
 if(!cs.length||!btn)return;
 let sel=-1,done=false;const RIGHT=1;
 const reset=()=>{done=false;sel=-1;cs.forEach(x=>{x.className='choice';const r=x.querySelector('.res');if(r)r.textContent=''});fb.style.display='none';btn.style.display='';btn.textContent='확인';btn.classList.add('off')};
 cs.forEach((c,i)=>c.style.cursor='pointer',0);
 cs.forEach((c,i)=>c.onclick=()=>{if(done){reset();return}sel=i;cs.forEach(x=>x.classList.toggle('sel',x===c));btn.classList.remove('off')});
 btn.style.cursor='pointer';
 btn.onclick=()=>{if(sel<0||done)return;done=true;const ok=sel===RIGHT;
  cs.forEach((x,i)=>{x.classList.remove('sel');if(i===RIGHT){x.classList.add('right');x.querySelector('.res').textContent='✓ 정답'}else if(i===sel){x.classList.add('wrong');x.querySelector('.res').textContent='✕ 오답'}else x.classList.add('mute')});
  fb.className='fb '+(ok?'ok':'no');fb.style.display='block';fb.querySelector('b').textContent=ok?'✓ 정답이에요!':'✕ 아쉬워요';btn.style.display='none'};
 fb.style.cursor='pointer';fb.onclick=reset;
}
function wireTrace(root){
 const lines=root.querySelectorAll('#trace2 .ln'),actor=root.querySelector('#actor'),bubble=root.querySelector('#bubble'),v2=root.querySelector('#v2'),narr=root.querySelector('#narr');
 if(!lines.length)return;
 const steps=[{l:0,x:'8%',b:'gifts = 3',v:'조건 = …',n:'1번째 줄: gifts는 3으로 설정됩니다'},{l:1,x:'30%',b:'3 > 3 ?',v:'조건 = …',n:'2번째 줄: 3 > 3 인지 확인합니다'},{l:1,x:'30%',b:'false',v:'조건 = false',n:'2번째 줄: 3은 3보다 크지 않아서 거짓입니다'},{l:2,x:'30%',b:'기다려요',v:'조건 = false',n:'3번째 줄: 조건이 거짓이라 else로 들어가 산타가 기다립니다'},{l:3,x:'8%',b:'return',v:'조건 = false',n:'4번째 줄: return으로 함수가 끝납니다. 배달은 하지 않아요'}];
 let i=0;const play=()=>{const s=steps[i];lines.forEach((e,k)=>e.classList.toggle('act',k===s.l));actor.style.left=s.x;bubble.textContent=s.b;v2.textContent=s.v;narr.childNodes[0].nodeValue=s.n;i=(i+1)%steps.length};
 play();setInterval(play,1800);
}

function drawTokens(){
 const el=document.querySelector('.screen');if(!el)return;
 const cs=getComputedStyle(el);
 const T=[['--bg','배경'],['--card','카드'],['--text','본문 글자'],['--sub','보조 글자'],['--accent','강조(버튼)'],['--onacc','강조 위 글자'],['--ok','정답'],['--bad','오답'],['--line','경계선'],['--soft','옅은 면'],['--easy','쉬움'],['--mid','보통'],['--hard','어려움'],['--t1','트리 연한 면'],['--t3','트리 진한 면']];
 document.getElementById('sw').innerHTML=T.map(([v,n])=>{const val=cs.getPropertyValue(v).trim();return `<div><i style="background:${val}"></i><span><b>${n}</b><br><code>${v}</code> ${val.startsWith('linear')?'그라데이션':val}</span></div>`}).join('');
 const m=document.getElementById('curmode');if(m)m.textContent=document.body.dataset.mode==='dark'?'다크':'라이트';
}
function initPage(skin){
 document.body.dataset.skin=skin;
 const root=document.body;
 function setMode(m){
  const eff=m==='auto'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):m;
  root.dataset.mode=eff;
  document.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  drawTokens();
 }
 document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
 setMode('auto');
}
buildManual('room');initPage('room');
document.querySelectorAll('.nomk').forEach(e=>e);
document.body.classList.add('nomk');
document.querySelectorAll('figure .demo').forEach(d=>{const p=d.closest('figure').querySelector('.phone');if(p.querySelector('#trace2'))wireTrace(p);else wireQuizDemo(p)});
</script>
