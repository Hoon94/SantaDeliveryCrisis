<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>퀴즈 iOS 앱 · 게임 테마 시안 4종</title>
<style>
:root{--page:#eceef2;--pagetext:#14161a;--pagesub:#5b6270;--pcard:#fff;--pline:#d9dce3}
body[data-mode=dark]{--page:#0d0e11;--pagetext:#f2f3f5;--pagesub:#9aa1ae;--pcard:#17191e;--pline:#2a2d35}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif;background:var(--page);color:var(--pagetext);transition:background .3s}
header.top{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--page) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--pline);padding:14px 28px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header.top h1{font-size:18px;font-weight:800;margin-right:auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button,.modebtn,.sbtn{border:1px solid var(--pline);background:var(--pcard);color:var(--pagetext);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.tabs button.on,.sbtn.on{background:var(--pagetext);color:var(--page);border-color:var(--pagetext)}
main{max-width:1600px;margin:0 auto;padding:28px}
.intro{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;margin-bottom:24px}
.intro h2{font-size:28px;margin-bottom:4px}
.intro .subt{color:var(--pagesub);font-weight:700;font-size:13px;margin-bottom:10px}
.intro p{color:var(--pagesub);line-height:1.65;font-size:14px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;border:1px solid var(--pline);color:var(--pagesub);margin:10px 6px 0 0}
.keys{background:var(--pcard);border:1px solid var(--pline);border-radius:16px;padding:16px 18px;font-size:13px;line-height:1.75;color:var(--pagesub)}
.keys b{color:var(--pagetext)}
.keys ul{padding-left:18px;margin:4px 0 10px}
.loop{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0 12px}
.loop span{background:var(--page);border:1px solid var(--pline);color:var(--pagetext);padding:4px 10px;border-radius:99px;font-weight:600;font-size:12px}
.loop i{color:var(--pagesub);font-style:normal}
.seasonbar{display:flex;gap:8px;margin:0 0 18px;align-items:center;font-size:13px;color:var(--pagesub)}
.screens{display:flex;gap:28px;overflow-x:auto;padding:8px 4px 28px;scroll-snap-type:x proximity}
.col{flex:0 0 auto;scroll-snap-align:start}
.cap{font-size:13px;font-weight:700;margin:0 0 10px 6px}
.cap small{display:block;font-weight:500;color:var(--pagesub);font-size:12px;margin-top:2px}
.compare{width:100%;border-collapse:collapse;background:var(--pcard);border-radius:16px;overflow:hidden;font-size:13px;margin-top:10px}
.compare th,.compare td{padding:12px 14px;border-bottom:1px solid var(--pline);text-align:left;vertical-align:top;line-height:1.5}
.compare th{color:var(--pagesub);font-weight:600;width:120px}
@media(max-width:900px){.intro{grid-template-columns:1fr}}

/* ===== phone ===== */
.phone{width:300px;height:620px;border-radius:44px;background:#000;padding:8px;box-shadow:0 20px 50px rgba(0,0,0,.28)}
.screen{position:relative;width:100%;height:100%;border-radius:36px;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px}
.status{position:absolute;top:0;left:0;right:0;height:38px;display:flex;justify-content:space-between;align-items:center;padding:6px 24px 0;font-size:12px;font-weight:700;z-index:5;color:var(--text)}
.island{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:80px;height:22px;background:#000;border-radius:20px;z-index:6}
.body{position:absolute;inset:0;padding:44px 16px 84px;overflow-y:auto;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.body.notab{padding-bottom:22px}
.home-ind{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:100px;height:4px;border-radius:4px;background:var(--text);opacity:.8;z-index:8}

/* ===== shared ui ===== */
.nav{display:flex;align-items:center;justify-content:space-between;min-height:30px;margin-bottom:8px}
.nav .t{font-weight:700;font-size:14px}
.nav .a{color:var(--accent);font-weight:600;font-size:13px}
.large{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:2px 0 10px;line-height:1.2}
.sub{color:var(--sub);font-size:12px}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px;border:1px solid var(--line)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:5px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:11px;font-weight:700;color:var(--sub)}
.chip.on{background:var(--accent);color:var(--onacc);border-color:var(--accent)}
.btn{display:block;width:100%;text-align:center;padding:13px;border-radius:var(--br,14px);background:var(--accent);color:var(--onacc);font-weight:800;font-size:14px;border:0;font-family:inherit;box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 60%,#000);margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:8px}
.bar.bad i{background:var(--bad)}
.dot{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:18px;background:color-mix(in srgb,var(--accent) 16%,transparent);flex:none}
.lst{background:var(--card);border-radius:var(--r);overflow:hidden;margin-bottom:12px;border:1px solid var(--line)}
.lst .it{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
.lst .it:last-child{border:0}
.lst .it b{font-size:13px;display:block}
.lst .it span.s{font-size:11px;color:var(--sub)}
.why{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.why span{font-size:10.5px;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.2);font-weight:700}
.hero{background:var(--hero);color:var(--onhero,#fff);border-radius:var(--r);padding:16px;margin-bottom:12px;position:relative;overflow:hidden}
.hero h3{font-size:17px;margin:6px 0 4px;letter-spacing:-.01em}
.hero p{font-size:12px;opacity:.9}
.hero .btn{background:var(--herobtn,#fff);color:var(--herobtntx,#222);margin:12px 0 0;padding:10px;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.h2{font-size:13px;font-weight:800;margin:6px 2px 8px;display:flex;justify-content:space-between;align-items:center}
.h2 small{font-weight:600;color:var(--sub);font-size:11px}
.tag{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:6px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);display:inline-block}
.tag.d{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.hero .tag{background:rgba(255,255,255,.22);color:inherit}

/* tab bar */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:72px;display:flex;justify-content:space-around;padding:8px 6px 0;z-index:7;background:var(--tabbg);border-top:1px solid var(--line)}
.tabbar div{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--sub);font-weight:700;width:60px}
.tabbar div svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar div.on{color:var(--accent)}
.floattab .tabbar{left:14px;right:14px;bottom:14px;height:56px;border-radius:28px;border:1px solid var(--line);box-shadow:0 8px 22px rgba(0,0,0,.22);padding-top:7px}

/* game world */
.scene{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);margin-bottom:12px;position:relative}
.scene svg{display:block;width:100%;height:auto}
.res{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.res span{flex:1;min-width:58px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 8px;font-weight:800;font-size:13px;text-align:center;white-space:nowrap}
.res small{display:block;font-size:9.5px;color:var(--sub);font-weight:600}
.mis{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.mis:last-child{border:0}
.mis .c{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:11px;color:#fff;flex:none}
.mis.d .c{background:var(--ok);border-color:var(--ok)}
.mis.d b{text-decoration:line-through;opacity:.55}
.mis b{font-size:12.5px;flex:1}
.mis em{font-style:normal;font-size:11px;font-weight:800;color:var(--accent)}
.goal{display:flex;gap:10px;align-items:center}
.goal .big{font-size:30px}

/* quiz */
.qmeta{display:flex;gap:6px;margin:6px 0 10px}
.q{font-size:16px;font-weight:800;line-height:1.4;margin-bottom:10px;letter-spacing:-.01em}
.media{height:92px;border-radius:var(--r);background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 30%,var(--card)),var(--card));display:grid;place-items:center;margin-bottom:10px;position:relative;overflow:hidden;border:1px solid var(--line)}
.media code{background:rgba(0,0,0,.45);color:#fff;padding:6px 10px;border-radius:8px;font-size:11px;font-family:ui-monospace,Menlo,monospace;line-height:1.5}
.media .play{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.55);color:#fff;border-radius:99px;padding:2px 8px;font-size:10px}
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hud .gain{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-weight:800;font-size:12px}
.ctx{font-size:11px;color:var(--sub);font-weight:600;margin-top:6px}
.pips{display:flex;gap:4px;margin:8px 0 4px}
.pips span{flex:1;height:24px;border-radius:8px;background:var(--card);border:1px dashed var(--line);display:grid;place-items:center;font-size:12px;transition:.2s}
.pips .f{border-style:solid;border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--card))}
.pips .w{opacity:.5;font-size:10px;border-style:solid}
.pips .cur{border:2px solid var(--text)}
.pips .pop{animation:pop .4s}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:var(--or,14px);background:var(--card);border:2px solid var(--line);cursor:pointer;font-weight:700;transition:.15s;user-select:none;box-shadow:0 3px 0 var(--line)}
.opt .k{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:11px;color:var(--sub);flex:none}
.opt:hover{border-color:var(--accent)}
.opt.ok{background:color-mix(in srgb,var(--ok) 18%,var(--card));border-color:var(--ok);box-shadow:0 3px 0 var(--ok);animation:pop .35s}
.opt.ok .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{background:color-mix(in srgb,var(--bad) 18%,var(--card));border-color:var(--bad);box-shadow:0 3px 0 var(--bad);animation:shake .4s}
.opt.bad .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opts.done .opt{pointer-events:none}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes pop{50%{transform:scale(1.06)}}
.fb{display:none;margin-top:10px;padding:10px 12px;border-radius:var(--r);font-size:12px;line-height:1.5}
.fb.show{display:block;animation:pop .3s}
.fb.ok{background:color-mix(in srgb,var(--ok) 16%,var(--card))}
.fb.bad{background:color-mix(in srgb,var(--bad) 16%,var(--card))}
.fb b{display:block;margin-bottom:2px;font-size:13px}
.fb small{color:var(--sub);display:block;margin-top:4px;font-size:10.5px}
.hint{font-size:10.5px;color:var(--sub);text-align:center;margin-top:8px}
.fly{position:absolute;left:50%;top:46%;font-size:26px;font-weight:900;z-index:20;pointer-events:none;animation:fly 1.1s ease-out forwards;color:var(--accent);text-shadow:0 2px 10px rgba(0,0,0,.35);white-space:nowrap}
@keyframes fly{0%{opacity:0;transform:translate(-50%,24px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1.25)}100%{opacity:0;transform:translate(-50%,-110px) scale(1)}}

/* result */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stats div{background:var(--card);border-radius:var(--r);padding:10px;text-align:center;border:1px solid var(--line)}
.stats b{display:block;font-size:16px}
.stats span{font-size:10px;color:var(--sub)}
.rwd{text-align:center;padding:16px 12px;background:var(--rwdbg,var(--card))}
.rwd .big{font-size:44px;line-height:1.1}
.rwd h3{font-size:17px;margin:6px 0 2px}
.rwd svg{height:140px;width:auto;display:block;margin:0 auto 4px}

/* chart */
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;padding:6px;border-radius:9px;font-weight:800;font-size:12px;color:var(--sub);cursor:pointer;font-family:inherit}
.seg button.on{background:var(--accent);color:var(--onacc)}
.chart{display:flex;align-items:flex-end;gap:7px;height:110px;margin-top:10px}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:9.5px;color:var(--sub)}
.chart i{display:block;width:100%;background:var(--accent);border-radius:6px 6px 3px 3px;transition:height .4s;opacity:.85}
.chart div:last-child i{opacity:1}
.kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.kpis div{background:var(--card);border-radius:var(--r);padding:10px;border:1px solid var(--line)}
.kpis span{font-size:10px;color:var(--sub);display:block}
.kpis b{font-size:18px;display:block;margin-top:2px}
.kpis em{font-style:normal;font-size:10px;color:var(--ok);font-weight:800}
.weak{margin-bottom:10px}
.weak .row{font-size:12px;margin-bottom:4px;font-weight:700}

/* form */
.field{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--line);gap:10px}
.field:last-child{border:0}
.field label{color:var(--sub);font-size:12px;flex:none}
.field .v{font-weight:700;text-align:right}
.ta{padding:12px 14px;font-weight:700;line-height:1.5;border-bottom:1px solid var(--line)}
.attach{display:flex;gap:8px;padding:12px 14px}
.attach div{flex:1;border:1.5px dashed var(--line);border-radius:10px;padding:10px 0;text-align:center;font-size:11px;color:var(--sub);font-weight:700}
.attach div.has{border-style:solid;border-color:var(--accent);color:var(--accent)}
.swipe{position:relative;overflow:hidden}
.swipe .del{position:absolute;right:0;top:0;bottom:0;width:64px;background:var(--bad);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px}
.swipe .it{position:relative;background:var(--card);transform:translateX(-64px)}
.search{background:var(--card);border-radius:12px;padding:8px 12px;color:var(--sub);margin-bottom:10px;font-size:12px;border:1px solid var(--line)}
.fab{position:absolute;right:16px;bottom:92px;width:48px;height:48px;border-radius:16px;background:var(--accent);color:var(--onacc);display:grid;place-items:center;font-size:24px;box-shadow:0 6px 16px rgba(0,0,0,.3);z-index:9}

/* ===== common animations ===== */
@keyframes fall{0%{transform:translateY(-10px);opacity:0}10%{opacity:1}100%{transform:translateY(150px);opacity:.1}}
@keyframes twinkle{50%{opacity:.3}}
@keyframes pulse{0%{r:22;opacity:.9}100%{r:34;opacity:0}}
@keyframes floaty{50%{transform:translateY(-8px) rotate(6deg)}}
.snow circle{animation:fall 5s linear infinite}
.twinkle{animation:twinkle 2.4s infinite}
.pulse{animation:pulse 1.8s infinite}

/* =============== A : 산타의 작업실 탈출 (크리스마스 트리 × 방탈출) =============== */
.t-a{--bg:#fbf3e6;--card:#fffdf8;--text:#2b1a14;--sub:#8c6f62;--accent:#c8382b;--onacc:#fff;--ok:#2f8f5b;--bad:#d64545;--line:#ecdcc6;--r:18px;--font:"Apple SD Gothic Neo","Pretendard",sans-serif;--tabbg:#fffaf0;--hero:linear-gradient(135deg,#1b6b42,#0f432b);--herobtn:#ffd96b;--herobtntx:#4a2a00;--wall:#f4dfc0;--floor:#c99d6b;--win:#bfe3ff;--rwdbg:linear-gradient(#fffdf8,#f8e9d0)}
[data-mode=dark] .t-a{--bg:#0c1a14;--card:#14271e;--text:#f7eedc;--sub:#9fb5a7;--accent:#ff6a5c;--onacc:#2a0b07;--line:#254036;--ok:#4ed08a;--bad:#ff7a7a;--tabbg:#0f2019;--wall:#16291f;--floor:#3b2a1c;--win:#0b2b4e;--hero:linear-gradient(135deg,#1f7a4c,#0f3b27);--rwdbg:linear-gradient(#14271e,#0f2019)}

/* =============== B : 무인도 탈출 (계절 이벤트 스킨) =============== */
.t-b{--bg:#e6f7f5;--card:#fff;--text:#0e3a40;--sub:#5a8589;--accent:#0f9fa8;--onacc:#fff;--ok:#27b36f;--bad:#ee5a5a;--line:#c8e6e3;--r:20px;--font:"Apple SD Gothic Neo","Pretendard",ui-rounded,sans-serif;--tabbg:#fff;--hero:linear-gradient(135deg,#17b5c6,#0a7ea4);--herobtn:#ffe08a;--herobtntx:#5a3a00;--sky1:#9fe3ef;--sky2:#e8fbff;--sea:#2aa6c4;--sand:#f3d9a0;--sun:#ffd25a;--rwdbg:linear-gradient(#e8fbff,#bfeef3)}
[data-mode=dark] .t-b{--bg:#05202a;--card:#0b3340;--text:#e6fbfb;--sub:#8ec0c4;--accent:#2fd6d6;--onacc:#022a2e;--line:#16505e;--ok:#3ee59a;--bad:#ff7b7b;--tabbg:#0a2d38;--sky1:#04131d;--sky2:#0d3a52;--sea:#0b5a78;--sand:#8a7a52;--sun:#e8edf5;--hero:linear-gradient(135deg,#0d7f93,#0a4a6e);--rwdbg:linear-gradient(#0d3a52,#0b3340)}

/* =============== C : 우주 탐사 =============== */
.t-c{--bg:#eceeff;--card:#fff;--text:#14173a;--sub:#6a6f9c;--accent:#5b4bff;--onacc:#fff;--ok:#12b57a;--bad:#ff5a7a;--line:#d8dbf6;--r:18px;--font:-apple-system,"SF Pro Display","Apple SD Gothic Neo",sans-serif;--tabbg:rgba(255,255,255,.95);--hero:linear-gradient(135deg,#1b1f5e,#4a2bb0);--herobtn:#8cf0d0;--herobtntx:#06352a;--space:#12154a;--onspace:#e8eaff;--rwdbg:linear-gradient(#1b1f5e,#32208a);--onrwd:#fff}
[data-mode=dark] .t-c{--bg:#050716;--card:#0e1230;--text:#eef0ff;--sub:#8e94c8;--accent:#8c7dff;--onacc:#0a0830;--line:#222858;--ok:#2ee6a0;--bad:#ff6b8a;--tabbg:rgba(11,14,40,.95);--space:#0a0d2c;--hero:linear-gradient(135deg,#17195a,#3a1f94);--rwdbg:linear-gradient(#17195a,#2a1a78)}
.t-c .rwd{color:#fff}
.t-c .rwd .sub{color:#c7caff}
.t-c .opt.ok,.t-c .opt.bad{box-shadow:0 0 18px -4px currentColor}
.t-c .opt.ok{color:var(--ok)}.t-c .opt.bad{color:var(--bad)}
.t-c .opt.ok>*,.t-c .opt.bad>*{color:var(--text)}
.t-c .opt.ok .k,.t-c .opt.bad .k{color:#fff}
.t-c .bar i{box-shadow:0 0 8px var(--accent)}
.t-c .stats b,.t-c .kpis b{font-family:ui-monospace,Menlo,monospace}

/* =============== D : 계절 이벤트 컬렉션 (시즌별 스킨 교체) =============== */
.t-d{--font:"Apple SD Gothic Neo","Pretendard",ui-rounded,sans-serif;--r:20px;--ok:#2dbd75;--bad:#ee5470}
.t-d[data-s=spring]{--bg:#fff1f6;--card:#fff;--text:#3b2230;--sub:#9a7184;--accent:#e8588b;--onacc:#fff;--line:#f6d5e2;--tabbg:#fff;--hero:linear-gradient(135deg,#f77fa8,#ffb3cd);--herobtn:#fff;--herobtntx:#b02a5c;--stage1:#ffd6e5;--stage2:#fff1f6;--rwdbg:linear-gradient(#ffe3ee,#fff)}
[data-mode=dark] .t-d[data-s=spring]{--bg:#1b1117;--card:#2a1b23;--text:#ffeaf1;--sub:#c49bb0;--accent:#ff8db4;--onacc:#3a0a1d;--line:#46303b;--tabbg:#24161e;--hero:linear-gradient(135deg,#b24773,#7a2f50);--stage1:#4a2a3a;--stage2:#2a1b23;--rwdbg:linear-gradient(#3a2230,#2a1b23)}

 <div class="card"><div class="row"><b>풀이 문제 수</b><span class="sp"></span><span class="sub">이번 주</span></div><div class="chart" data-chart>${bars('주')}</div></div>
 <div class="card"><div class="row"><b>${t.collect[0]}</b><span class="sp"></span><span class="sub">${t.collect[1]}</span></div><div class="bar" style="margin-top:8px"><i style="width:${t.collect[2]}%"></i></div></div>
 <div class="card"><div class="h2" style="margin-top:0">${t.weakTitle}</div>${[['CS · 자료구조',42],['Design · 접근성',55],['iOS · 동시성',61]].map(w=>`<div class="weak"><div class="row"><span>${w[0]}</span><span class="sp"></span><span class="sub">${w[1]}%</span></div><div class="bar bad"><i style="width:${w[1]}%"></i></div></div>`).join('')}</div>`}

function manage(k){const t=th(k);const z=t.zones;
 return `<div class="nav"><span class="t" style="font-size:22px;font-weight:800">${t.mgr}</span><span class="a">편집</span></div>
 <div class="search">🔍 문제·태그 검색</div>
 <div class="chips"><span class="chip on">전체 420</span><span class="chip">iOS</span><span class="chip">Design</span><span class="chip">CS</span></div>
 <div class="lst">
 <div class="swipe"><div class="del">삭제</div><div class="it"><div class="dot">🖼</div><div><b>SwiftUI 뷰 생명주기는?</b><span class="s">${z[0][1]} · 보통 · 이미지</span></div></div></div>
 <div class="it"><div class="dot">🎬</div><div><b>이 애니메이션의 이징 곡선은?</b><span class="s">${z[1][1]} · 쉬움 · 영상</span></div></div>
 <div class="it"><div class="dot">📝</div><div><b>해시 충돌 해결 방법</b><span class="s">${z[2][1]} · 어려움 · 텍스트</span></div></div>
 <div class="it"><div class="dot">🖼</div><div><b>다크모드 대비 비율 기준</b><span class="s">${z[1][1]} · 보통 · 이미지</span></div></div>
 <div class="it"><div class="dot">📝</div><div><b>async/await 와 Task</b><span class="s">${z[0][1]} · 어려움 · 텍스트</span></div></div></div>
 <div class="hint">← 스와이프로 삭제 · 탭하여 편집</div>`}
function edit(k){const t=th(k);
 return `<div class="nav"><span class="a">취소</span><span class="t">문제 편집</span><span class="a">저장</span></div>
 <div class="h2">문제</div><div class="lst"><div class="ta">다음 코드의 출력 결과로 알맞은 것은?</div><div class="attach"><div class="has">🖼 이미지</div><div class="has">🎬 영상</div><div>＋ 파일</div></div></div>
 <div class="h2">보기 (정답 선택)</div>
 <div class="lst">${['0','1','5','컴파일 오류'].map((o,i)=>`<div class="field"><label>${'ABCD'[i]}</label><span class="v" style="flex:1;text-align:left">${o}</span><span style="color:${i==1?'var(--ok)':'var(--line)'};font-size:16px">${i==1?'●':'○'}</span></div>`).join('')}<div class="field"><label style="color:var(--accent)">＋ 보기 추가</label></div></div>
 <div class="h2">분류 · 게임 연결</div>
 <div class="lst"><div class="field"><label>카테고리</label><span class="v">CS ›</span></div><div class="field"><label>난이도</label><span class="v">보통 ›</span></div><div class="field"><label>태그</label><span class="v"><span class="tag">#Swift</span> <span class="tag">#값타입</span></span></div>
 <div class="field"><label>배치 위치</label><span class="v">${t.zones[2][0]} ${t.zones[2][1]} ›</span></div><div class="field"><label>보상</label><span class="v">${t.rw} ${t.rwName} +1</span></div></div>
 <div class="btn" style="background:transparent;color:var(--bad);border:1px solid var(--line);box-shadow:none">문제 삭제</div>`}

/* ---------- 렌더 ---------- */
let cur='a';
function mk(k){return [
 ['게임 메인 (월드)','진행 상황 · 미션 · 이어서 하기',phone(k,world(k),{tab:0})],
 ['출제 · 반응형 + 필터','추천 세션 · 카테고리/태그/난이도',phone(k,setup(k),{tab:1})],
 ['퀴즈 진행 · 보상 피드백','보기를 눌러보세요 (텍스트+영상)',phone(k,quiz(k))],
 ['세션 결과 · 보상','보상 · 오답 노트 · 추천 리소스',phone(k,result(k))],
 ['성과 대시보드','주/월 전환을 눌러보세요',phone(k,dash(k),{tab:2})],
 ['콘텐츠 관리 · 목록','검색 · 필터 · 스와이프 삭제',phone(k,manage(k),{tab:3,fab:true})],
 ['콘텐츠 관리 · 편집','이미지·영상 첨부 · 게임 배치',phone(k,edit(k))]
 ].map((s,i)=>`<div class="col"><div class="cap">${i+1}. ${s[0]}<small>${s[1]}</small></div>${s[2]}</div>`).join('')}

function render(){const t=th(cur);
 document.getElementById('tabs').innerHTML=Object.keys(BASE).map(k=>`<button class="${k===cur?'on':''}" data-k="${k}">${BASE[k].name.split(' ·')[0]} · ${BASE[k].name.split('· ')[1]}</button>`).join('');
 document.getElementById('intro').innerHTML=`<div><h2>${t.name}</h2><div class="subt">${t.sub}</div><p style="font-size:16px;color:var(--pagetext);font-weight:700;margin-bottom:8px">${t.title}</p><p>${t.desc}</p>${t.pills.map(p=>`<span class="pill">${p}</span>`).join('')}</div>
 <div class="keys"><b>게임 루프 (한 번의 반복)</b><div class="loop">${t.loop.map((l,i)=>(i?'<i>→</i>':'')+`<span>${l}</span>`).join('')}</div>
 <b>핵심 기능과의 연결</b><ul>${t.map.map(m=>`<li>${m}</li>`).join('')}</ul><b>오답 처리</b>: ${t.note}</div>`;
 const sb=document.getElementById('seasonbar');
 sb.innerHTML=cur==='d'?`<span>시즌 스킨 바꾸기:</span>`+Object.keys(SEASONS).map(s=>`<button class="sbtn ${s===season?'on':''}" data-s="${s}">${SEASONS[s].label}</button>`).join('')+`<span>→ 구조는 그대로, 이미지·색·문구만 교체됩니다.</span>`:'';
 document.getElementById('screens').innerHTML=mk(cur);bind()}

function bind(){
 document.querySelectorAll('.screen').forEach(sc=>{const box=sc.querySelector('.opts');if(!box)return;const k=sc.dataset.k,t=th(k);
  box.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{
   if(box.classList.contains('done'))return;box.classList.add('done');
   const ok=o.dataset.i==='1';box.children[1].classList.add('ok');if(!ok)o.classList.add('bad');
   sc.querySelectorAll('.fb').forEach(f=>f.classList.remove('show'));sc.querySelector('.fb.'+(ok?'ok':'bad')).classList.add('show');
   const pip=sc.querySelector('.pips .cur'),cnt=sc.querySelector('.cnt');
   pip.className=ok?'f pop':'w pop';pip.textContent=ok?t.rw:'✕';
   if(ok){cnt.textContent=+cnt.textContent+1;const f=document.createElement('div');f.className='fly';f.textContent='+1 '+t.rw;sc.appendChild(f);setTimeout(()=>f.remove(),1200)}
   const hint=sc.querySelector('.hint');hint.innerHTML='<u style="cursor:pointer" class="again">다시 해보기</u>';
   hint.querySelector('.again').onclick=()=>{box.classList.remove('done');box.querySelectorAll('.opt').forEach(x=>x.classList.remove('ok','bad'));sc.querySelectorAll('.fb').forEach(f=>f.classList.remove('show'));pip.className='cur';pip.textContent='';if(ok)cnt.textContent=+cnt.textContent-1;hint.textContent='↑ 보기를 눌러 보상 연출을 확인해보세요'};
   beep(ok);if(navigator.vibrate)navigator.vibrate(ok?30:[40,40,40]);
  })});
 document.querySelectorAll('.seg').forEach(s=>s.querySelectorAll('button').forEach(b=>b.onclick=()=>{s.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');s.parentElement.querySelector('[data-chart]').innerHTML=bars(b.dataset.p)}))}

let ac;function beep(ok){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type=ok?'sine':'sawtooth';o.frequency.setValueAtTime(ok?660:200,ac.currentTime);if(ok)o.frequency.exponentialRampToValueAtTime(1100,ac.currentTime+.15);g.gain.setValueAtTime(.12,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.3);o.start();o.stop(ac.currentTime+.3)}catch(e){}}

document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(b){cur=b.dataset.k;render()}};
document.getElementById('seasonbar').onclick=e=>{const b=e.target.closest('button');if(b){season=b.dataset.s;render()}};
const mb=document.getElementById('modebtn');
function setMode(m){document.body.dataset.mode=m;mb.textContent=m==='dark'?'☀️ 라이트모드 미리보기':'🌙 다크모드 미리보기'}
mb.onclick=()=>setMode(document.body.dataset.mode==='dark'?'light':'dark');
if(matchMedia('(prefers-color-scheme:dark)').matches)setMode('dark');

document.getElementById('compare').innerHTML=`<tr><th></th>${Object.keys(BASE).map(k=>`<th style="color:var(--pagetext)">${BASE[k].name}</th>`).join('')}</tr>`+
[['조합',['크리스마스 트리 + 방탈출','무인도 탈출 + 계절 이벤트','우주 탐사','계절 이벤트 (독립)']],
 ['분위기',['따뜻함·아늑한 긴장감','모험·시원함','신비·미래적','귀엽고 산뜻함']],
 ['핵심 보상',['트리 장식 → 열쇠 조각','재료 → 뗏목 6단계','연료 → 행성 도감','시즌 포인트 → 한정 아이템']],
 ['목표 길이',['짧음~중간 (방 단위)','길다 (뗏목 완성까지 수 주)','길다 (행성 지도 확장)','시즌 단위 (약 한 달)']],
 ['제작 부담',['중간 (방 배경, 장식)','중간 (뗏목 6단계, 스킨)','낮음 (도형 위주)','낮음 (이미지 세트 교체)']],
 ['주의점',['시즌 종료 후 재사용 방안 필요','스킨 교체 일정 관리','단조롭지 않게 행성별 변화 필요','시즌마다 콘텐츠 제작 필요']]]
.map(r=>`<tr><th>${r[0]}</th>${r[1].map(c=>`<td>${c}</td>`).join('')}</tr>`).join('');
render();
</script>
</body>
</html>
