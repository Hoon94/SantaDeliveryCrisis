<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bridge.logic · Swift 직감 퀴즈</title>
<style>
:root{
  --page:#d6d6d9; --ink:#111112; --ink2:#18181a; --ink3:#222225;
  --txt:#f4f4f5; --dim:#8d8d94;
  --coral:#ec5a62; --mint:#9bc6ae; --amber:#f0a23c; --blue:#4aa3f0; --teal:#3cc8b4; --lime:#b9f26b;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --spring:cubic-bezier(.2,1.25,.4,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);color:var(--txt);min-height:100vh;overflow-x:hidden;background:linear-gradient(180deg,#efeff1 0%,var(--page) 100%) fixed}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
.page{position:relative;max-width:1240px;margin:0 auto;padding:28px 24px 80px}

/* ---------- ambient background (아주 약하게) ---------- */
.ambient{position:fixed;inset:-15%;z-index:-1;pointer-events:none;filter:blur(70px);opacity:.5}
.ambient i{position:absolute;border-radius:50%;width:52vw;height:52vw;animation:drift 32s ease-in-out infinite}
.ambient i:nth-child(1){left:-6%;top:-12%;background:radial-gradient(circle,rgba(155,198,174,.55),transparent 65%)}
.ambient i:nth-child(2){right:-8%;top:20%;background:radial-gradient(circle,rgba(74,163,240,.32),transparent 65%);animation-duration:38s;animation-delay:-9s}
.ambient i:nth-child(3){left:25%;bottom:-24%;background:radial-gradient(circle,rgba(236,90,98,.26),transparent 65%);animation-duration:44s;animation-delay:-18s}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(7vw,5vh) scale(1.12)}}
.sheen{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.55;
  background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.35) 50%,transparent 62%);background-size:260% 100%;animation:sheen 22s ease-in-out infinite}
@keyframes sheen{0%{background-position:130% 0}100%{background-position:-30% 0}}

/* ---------- top ---------- */
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;color:#222}
.brand{font-weight:700;letter-spacing:-.02em;font-size:18px;display:flex;align-items:center;gap:8px}
.brand i{width:12px;height:12px;border-radius:4px;background:var(--coral);display:inline-block;animation:brandspin 6s linear infinite}
@keyframes brandspin{50%{transform:rotate(180deg) scale(.8);border-radius:50%}}
.toggle{font-size:13px;padding:9px 15px;border-radius:999px;background:rgba(0,0,0,.07);transition:background .2s,transform .2s}
.toggle:hover{background:rgba(0,0,0,.14);transform:scale(1.04)}
.hint{font-size:12px;color:#55555c;margin-right:12px;transition:opacity .4s}
.hint.off{opacity:0}

.view{transition:opacity .45s,transform .55s var(--spring),filter .45s}
.view.hidden{opacity:0;transform:scale(.97) translateY(12px);filter:blur(6px);pointer-events:none;position:absolute;left:0;right:0;top:0;visibility:hidden}
.stage-wrap{position:relative}

/* ---------- cards ---------- */
.card{position:relative;background:linear-gradient(180deg,var(--ink2),var(--ink));border-radius:44px;overflow:hidden;isolation:isolate;box-shadow:0 30px 60px -30px rgba(0,0,0,.5)}
.card::before{content:"";position:absolute;inset:-30%;z-index:0;pointer-events:none;opacity:.9;
  background:radial-gradient(40% 40% at 30% 30%,rgba(155,198,174,.09),transparent 70%),radial-gradient(35% 35% at 75% 70%,rgba(74,163,240,.08),transparent 70%);
  animation:cardAmb 24s ease-in-out infinite}
@keyframes cardAmb{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(6%,4%) rotate(8deg)}}
.card::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity .4s;
  background:radial-gradient(420px circle at var(--px,50%) var(--py,50%),rgba(255,255,255,.09),transparent 60%)}
.card:hover::after{opacity:1}
.card>*{position:relative;z-index:1}
.hero{height:440px;margin-bottom:22px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.mini{height:570px}
.copy{position:absolute;left:56px;top:56px;max-width:46%;z-index:3}
.mini .copy{left:40px;top:44px;max-width:calc(100% - 80px)}
.title{display:flex;align-items:center;gap:20px}
.tile{width:60px;height:60px;border-radius:18px;display:grid;place-items:center;flex:none;transition:transform .5s var(--spring)}
.tile svg{width:30px;height:30px;stroke:#111;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.card:hover .tile{transform:rotate(-8deg) scale(1.08)}
h2.name{font-size:clamp(34px,4.6vw,58px);font-weight:600;letter-spacing:-.045em;line-height:1}
.mini h2.name{font-size:38px}
.badge{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--blue);color:#06233f;font-weight:600;align-self:center}
.desc{margin-top:22px;color:#a2a2a9;font-size:clamp(16px,1.6vw,20px);line-height:1.5;letter-spacing:-.015em;max-width:420px}
.mini .desc{font-size:17px;margin-top:18px}
.pill{display:inline-flex;align-items:center;gap:10px;margin-top:30px;background:#fff;color:#111;border-radius:999px;padding:16px 28px;font-size:18px;font-weight:500;letter-spacing:-.02em;
  transition:box-shadow .3s,transform .25s var(--spring);will-change:transform}
.pill:hover{box-shadow:0 10px 36px -4px rgba(255,255,255,.35)}
.pill .arr{display:inline-block;transition:transform .3s var(--spring)}
.pill:hover .arr{transform:translateX(5px)}
.mini .pill{font-size:17px;padding:14px 24px;margin-top:26px}

/* ---------- 카드 더미 (코드 / 그림 / 선택지) ---------- */
.stack{position:absolute;inset:0;perspective:1200px;pointer-events:none}
.plate{position:absolute;border-radius:34px;overflow:hidden;
  transform:translate3d(calc(var(--mx,0)*var(--d)*1px),calc(var(--my,0)*var(--d)*.7px),0);
  transition:rotate .8s var(--spring),translate .8s var(--spring),transform .15s linear,filter .5s;
  box-shadow:0 24px 50px -16px rgba(0,0,0,.6)}
.hero .plate{width:300px;height:420px;top:80px}
.hero .p3{left:calc(54% + 150px);rotate:11deg;--d:6;top:30px}
.hero .p2{left:calc(54% + 40px);rotate:5deg;--d:12;top:55px}
.hero .p1{left:calc(54% - 70px);rotate:-3deg;--d:20;top:90px}
.hero:hover .p3{rotate:17deg;translate:60px -18px}
.hero:hover .p2{rotate:9deg;translate:24px -10px}
.hero:hover .p1{rotate:-7deg;translate:-34px 6px}
.mini .plate{width:250px;height:350px}
.mini .p3{left:46%;rotate:9deg;--d:5;bottom:-165px}
.mini .p2{left:27%;rotate:4deg;--d:9;bottom:-145px}
.mini .p1{left:7%;rotate:-3deg;--d:14;bottom:-120px}
.mini:hover .p3{rotate:14deg;translate:34px -22px}
.mini:hover .p2{rotate:8deg;translate:10px -14px}
.mini:hover .p1{rotate:-6deg;translate:-12px -8px}
.plate .inner{position:absolute;left:0;top:0;width:250px;height:350px;transform-origin:0 0}
.hero .plate .inner{transform:scale(1.2)}
/* 카드 안 요소는 호버할 때만 움직인다 */
.plate *,.plate *::before,.plate *::after{animation-play-state:paused}
.card:hover .plate *,.card:hover .plate *::before,.card:hover .plate *::after{animation-play-state:running}

.p1 .inner{padding:24px 22px;color:#10241c}
.meta{font-size:13px;letter-spacing:.06em;font-weight:600;opacity:.55}
.pcode{margin-top:30px;font-family:var(--mono);font-size:14.5px;line-height:2.05;white-space:pre}
.pcode mark{color:inherit;border-radius:5px;padding:1px 3px;margin:0 -3px;background:linear-gradient(rgba(0,0,0,.2),rgba(0,0,0,.2)) no-repeat 0 0/0% 100%;transition:background-size .7s .35s}
.card:hover .pcode mark{background-size:100% 100%}
.p2 .inner{background:linear-gradient(180deg,#2a2a31,#17171a)}
.p3{background:#0b0b0c;border:1px solid #2a2a2e}
.p3 .inner{padding:24px 22px}
.p3 .meta{color:#fff;opacity:.4}
.pchips{margin-top:36px;display:grid;gap:14px}
.chip{display:block;background:#fff;color:#111;border-radius:999px;padding:13px 18px;font-size:14.5px;font-weight:600;letter-spacing:-.02em;animation:chipglow 3s ease-in-out infinite}
.chip:nth-child(2){animation-delay:.6s}.chip:nth-child(3){animation-delay:1.2s}
@keyframes chipglow{0%,60%,100%{transform:none;background:#fff}25%{transform:translateX(6px);background:var(--c)}}

/* ----- 미리보기 그림 ----- */
.pic{position:absolute;inset:0;overflow:hidden}
.pic>*{position:absolute}
.pgl{left:0;width:90px;bottom:0;height:104px;background:linear-gradient(180deg,#1f2d28,#101615);border-top:2px solid var(--mint)}
.pgr{right:0;width:96px;bottom:0;height:104px;background:linear-gradient(180deg,#1f2d28,#101615);border-top:2px solid var(--mint)}
.pgf{left:0;right:0;bottom:0;height:104px;background:linear-gradient(180deg,#1f2d28,#101615);border-top:2px solid var(--mint)}
.priv{left:88px;right:94px;bottom:0;height:84px;background:linear-gradient(180deg,#0e3452,#08192a)}
.pbr{left:70px;right:76px;bottom:94px;height:12px;border-radius:3px;background:repeating-linear-gradient(90deg,#c49a6c 0 12px,#7a5838 12px 14px);transform-origin:50% 100%;animation:pbridge 2.8s ease-in-out infinite}
@keyframes pbridge{0%,100%{transform:none}50%{transform:translateY(-2px)}}
.ptree{right:12px;bottom:104px;width:84px;height:130px}
.ptree .tr{position:absolute;left:34px;bottom:0;width:14px;height:56px;background:#5b3a29;border-radius:3px}
.ptree .cr{position:absolute;left:6px;top:0;width:72px;height:72px;border-radius:50%;background:#2f7a5c;box-shadow:-18px 20px 0 -6px #276a4f,18px 20px 0 -6px #276a4f;animation:crown 5s ease-in-out infinite;transform-origin:50% 100%}
.ptree .ap{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--coral);transform-origin:50% -6px;animation:sway 2.6s ease-in-out infinite}
.ptree .ap:nth-child(3){animation-duration:3.1s;animation-delay:-.7s}.ptree .ap:nth-child(4){animation-duration:2.3s;animation-delay:-1.4s}
.pmoon{top:46px;right:56px;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#b9c9ea);box-shadow:0 0 24px 4px rgba(190,215,255,.25)}
.mrab{width:62px}
.mrab svg{width:100%;display:block;overflow:visible}
.mrab .hop{animation:ghop 2.8s ease-in-out infinite}
@keyframes ghop{0%,52%,100%{transform:none}62%{transform:translateY(-10px) scale(.97,1.04)}72%{transform:translateY(0) scale(1.05,.95)}82%{transform:none}}
.pcloud{left:64px;top:44px;width:122px;height:44px;border-radius:30px;background:#8c97b0;animation:bob 4s ease-in-out infinite}
.pcloud::before,.pcloud::after{content:"";position:absolute;border-radius:50%;background:inherit}
.pcloud::before{width:50px;height:50px;left:16px;top:-24px}.pcloud::after{width:38px;height:38px;left:62px;top:-14px}
@keyframes bob{50%{transform:translateY(-3px)}}
.pdrops{left:64px;top:90px;width:122px;height:120px;opacity:.25;transition:opacity .6s .3s;
  background:repeating-linear-gradient(100deg,transparent 0 11px,rgba(170,200,255,.8) 11px 12px,transparent 12px 22px);animation:rainfall .55s linear infinite;
  -webkit-mask-image:linear-gradient(#000 40%,transparent);mask-image:linear-gradient(#000 40%,transparent)}
.card:hover .pdrops{opacity:.9}
@keyframes rainfall{to{background-position:-14px 46px}}
.pumb{width:74px;height:36px;border-radius:74px 74px 0 0;background:var(--coral);scale:.2;opacity:0;transform-origin:50% 100%;transition:scale .7s var(--spring) .9s,opacity .4s .9s}
.card:hover .pumb{scale:1;opacity:1}
.pcar{width:20px;height:34px;animation:carbob 2.6s ease-in-out infinite;transform-origin:50% 100%}
.pcar:nth-of-type(2){animation-delay:.45s}.pcar:nth-of-type(3){animation-delay:.9s}.pcar:nth-of-type(4){animation-delay:1.35s}
@keyframes carbob{0%,60%,100%{transform:none}30%{transform:translateY(-8px) rotate(-6deg)}}
.pbask{width:56px;height:30px;border-radius:6px 6px 16px 16px;background:repeating-linear-gradient(0deg,#c9852a 0 5px,#e0a04a 5px 10px)}
.pfloat{font-size:13px;font-weight:700;color:#111;background:#fff;border-radius:999px;padding:2px 8px;animation:pfloat 2.6s ease-in infinite;opacity:0}
@keyframes pfloat{0%,40%{opacity:0;transform:translate(0,0)}55%{opacity:1}100%{opacity:0;transform:translate(-90px,-26px)}}
.pgift{width:80px;height:52px;background:#d44c54;border-radius:6px}
.pgift::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:10px;margin-left:-5px;background:#ffd36b}
.plid{width:92px;height:20px;background:#ec5a62;border-radius:6px;transition:translate .7s var(--spring) .8s,rotate .7s var(--spring) .8s}
.plid::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:10px;margin-left:-5px;background:#ffd36b}
.card:hover .plid{translate:-6px -22px;rotate:-12deg}
.pq{font-size:34px;font-weight:700;color:#fff;animation:qfloat 2.4s ease-in-out infinite}
@keyframes qfloat{50%{transform:translateY(-8px);opacity:.6}}
.mrab.peek .head{animation:peek 3.2s ease-in-out infinite;transform-origin:56px 66px;transform-box:view-box}
@keyframes peek{0%,100%{transform:none}40%,60%{transform:rotate(9deg)}}

/* ---------- play ---------- */
.play{padding:28px;border-radius:48px}
.bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.back{background:#fff;color:#111;border-radius:999px;padding:11px 20px;font-size:15px;font-weight:500;transition:transform .25s var(--spring)}
.back:hover{transform:translateX(-4px)}
.prog{font-family:var(--mono);color:var(--dim);font-size:14px;letter-spacing:.1em}
.prog b{color:var(--txt)}
.cols{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:20px}
@media (max-width:940px){.cols{grid-template-columns:1fr}.row{grid-template-columns:1fr}.hero .copy{max-width:80%}.hero .stack{opacity:.35}.copy{left:32px;top:36px}}
.panel{background:var(--ink3);border-radius:32px;position:relative}
.code{padding:44px 0 20px;font-family:var(--mono);font-size:clamp(14px,1.4vw,16.5px);line-height:2}
.ln{display:flex;position:relative;padding-right:22px;white-space:pre;opacity:.5;transition:opacity .3s,background .3s}
.ln::before{content:attr(data-n);width:50px;text-align:right;padding-right:20px;color:#55555c;flex:none}
.ln::after{content:"";position:absolute;left:0;top:4px;bottom:4px;width:3px;border-radius:3px;background:var(--mint);transform:scaleY(0);transition:transform .25s var(--spring)}
.ln.active{opacity:1;background:linear-gradient(90deg,rgba(155,198,174,.2),transparent)}
.ln.active::after{transform:scaleY(1)}
.ln.active.bad{background:linear-gradient(90deg,rgba(236,90,98,.24),transparent)}
.ln.active.bad::after{background:var(--coral)}
.ln.idle{opacity:.9}
.kw{color:#ff8fb1}.num{color:var(--amber)}.fn{color:var(--mint)}.cm{color:#66666e}.str{color:#a5e3a0}.ty{color:var(--lime)}
.tok{position:relative;cursor:help;border-radius:4px;transition:background .2s}
.tok:hover,.tok.pair{background:rgba(255,255,255,.14)}
.tok::after{content:attr(data-tip);position:absolute;left:0;bottom:calc(100% + 8px);white-space:nowrap;background:#fff;color:#111;font:500 13px var(--sans);padding:7px 12px;border-radius:999px;
  opacity:0;transform:translateY(6px) scale(.92);transform-origin:left bottom;transition:.25s var(--spring);pointer-events:none;z-index:20}
.tok:hover::after{opacity:1;transform:none}
.status{margin:0 22px 22px;padding-top:16px;border-top:1px solid #333338;font-family:var(--mono);font-size:13px;color:var(--dim);min-height:44px;display:flex;align-items:center;gap:10px}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.status.exec .dot{background:var(--amber);animation:pulse 1s infinite}
.status.pass .dot{background:var(--mint)}.status.fail .dot{background:var(--coral)}
.status.fail #stxt{color:var(--coral)}.status.pass #stxt{color:var(--mint)}
@keyframes pulse{50%{opacity:.3;transform:scale(1.6)}}

/* ---------- 장면 공통 ---------- */
.scene{height:100%;min-height:390px;border-radius:32px;overflow:hidden;position:relative;background:radial-gradient(120% 90% at 70% 0%,#1b2236,#0c0d12 70%);isolation:isolate}
.world{position:absolute;inset:0}
.layer{position:absolute;translate:calc(var(--mx,0)*var(--d,0)*1px) calc(var(--my,0)*var(--d,0)*.6px);transition:translate .2s linear}
.moon{top:30px;right:14%;width:38px;height:38px;border-radius:50%;--d:-4;background:radial-gradient(circle at 35% 35%,#fff,#d8e6ff 60%,#9fb4d8);box-shadow:0 0 40px 8px rgba(190,215,255,.25)}
.star{width:2px;height:2px;background:#fff;border-radius:50%;animation:tw 3s infinite}
@keyframes tw{50%{opacity:.2}}
.bank{bottom:0;height:86px;background:linear-gradient(180deg,#1d2a26,#101615);border-top:2px solid var(--mint);--d:3}
.bank.l{left:-4%;width:30%;border-top-right-radius:18px}
.bank.r{right:-4%;width:32%;border-top-left-radius:18px}
.bank.full{left:-5%;width:110%}
.river{left:22%;right:24%;bottom:0;height:80px;overflow:hidden;background:linear-gradient(180deg,#0e3452,#08192a);--d:2}
.river::before,.river::after{content:"";position:absolute;left:-100%;width:300%;height:2px;background:rgba(150,210,255,.45);top:24px;box-shadow:0 14px 0 rgba(150,210,255,.28),0 28px 0 rgba(150,210,255,.18);
  -webkit-mask-image:repeating-linear-gradient(90deg,#000 0 30px,transparent 30px 74px);mask-image:repeating-linear-gradient(90deg,#000 0 30px,transparent 30px 74px);animation:flow 7s linear infinite}
.river::after{top:40px;animation-duration:11s;opacity:.6}
@keyframes flow{to{transform:translateX(33.33%)}}
.bridge{left:21%;right:23%;bottom:80px;height:22px;display:flex;z-index:3;--d:4;cursor:pointer}
.plank{flex:1;margin:0 1px;background:linear-gradient(180deg,#c49a6c,#8a6542);border-radius:3px 3px 2px 2px;height:12px;align-self:flex-end}
.bridge:hover .plank{animation:plank .7s calc(var(--i)*38ms) var(--spring)}
@keyframes plank{40%{transform:translateY(-9px) rotate(var(--rr,2deg))}}
.sign{left:24%;bottom:104px;font-size:11px;color:var(--amber);letter-spacing:.14em;padding:4px 9px;border:1px solid rgba(240,162,60,.5);border-radius:6px;z-index:4;--d:4}
.tree{right:6%;bottom:84px;width:176px;z-index:5;--d:8;cursor:pointer}
.tree svg{width:100%;display:block;overflow:visible}
.crown{transform-box:fill-box;transform-origin:50% 100%;animation:crown 5s ease-in-out infinite}
@keyframes crown{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.4deg)}}
.apple{transform-box:fill-box;transform-origin:50% 0;animation:sway 2.6s ease-in-out infinite}
.apple:nth-of-type(2){animation-duration:3.1s;animation-delay:-.7s}.apple:nth-of-type(3){animation-duration:2.3s;animation-delay:-1.4s}
@keyframes sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.tree:hover .apple{animation:rattle .22s linear infinite}
.tree:hover .crown{animation:rattleC .3s linear infinite}
@keyframes rattle{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
@keyframes rattleC{0%,100%{transform:rotate(-2.4deg)}50%{transform:rotate(2.4deg)}}
.apple.pop{animation:applePop .6s var(--spring)}
@keyframes applePop{0%{transform:scale(1)}40%{transform:scale(1.7)}100%{transform:scale(1)}}
.apple .glow{opacity:0;transition:opacity .3s}.apple.lit .glow{opacity:1}
.tagc{left:18px;top:18px;z-index:7;font-size:13px;font-weight:600;color:#111;background:#fff;padding:6px 13px;border-radius:999px;opacity:0;transform:translateY(8px) scale(.8);transition:.4s var(--spring);--d:6;font-family:var(--mono)}
.tagc.show{opacity:1;transform:none}
.counter{right:calc(6% + 66px);bottom:278px;z-index:7;font-size:13px;font-weight:600;color:#111;background:#fff;padding:5px 12px;border-radius:999px;opacity:0;transform:translateY(8px) scale(.8);transition:.4s var(--spring);--d:8}
.counter.show{opacity:1;transform:none}

/* ----- 토끼 ----- */
.actor{left:10%;bottom:84px;width:96px;z-index:6;--d:12;transform:translateX(-50%)}
.actor svg{width:100%;display:block;overflow:visible;cursor:pointer}
.shadow{position:absolute;left:50%;bottom:-4px;width:60px;height:10px;margin-left:-30px;border-radius:50%;background:rgba(0,0,0,.6);filter:blur(2px);animation:shIdle 3.4s infinite}
.actor.walk .shadow{animation:shWalk .46s infinite}
@keyframes shIdle{0%,58%,100%{transform:scale(1)}66%{transform:scale(.6);opacity:.4}76%{transform:scale(1.1)}}
@keyframes shWalk{0%,100%{transform:scale(1)}50%{transform:scale(.55);opacity:.4}}
.flip{transition:transform .4s var(--spring);transform-origin:50px 70px;transform-box:view-box}
.actor.face-left .flip{transform:scaleX(-1)}
.actor.lean:not(.face-left) .flip{transform:rotate(9deg) translateX(5px)}
.hop{transform-origin:50px 112px;transform-box:view-box;animation:idle 3.4s infinite}
@keyframes idle{0%,56%{transform:none}60%{transform:translateY(1px) scale(1.06,.92)}68%{transform:translateY(-20px) scale(.94,1.08)}76%{transform:translateY(0) scale(1.08,.9)}82%{transform:none}88%{transform:translateY(-8px) scale(.98,1.03)}94%,100%{transform:none}}
.actor.walk .hop{animation:walkhop .46s infinite}
@keyframes walkhop{0%{transform:translateY(0) scale(1.08,.88) rotate(0)}45%{transform:translateY(-22px) scale(.93,1.1) rotate(7deg)}100%{transform:translateY(0) scale(1.08,.88) rotate(0)}}
.actor.happy .hop,.actor.poke .hop{animation:happy .5s 4}
.actor.poke .hop{animation-iteration-count:1}
@keyframes happy{0%,100%{transform:translateY(0) scale(1.1,.88)}50%{transform:translateY(-34px) scale(.9,1.12) rotate(-8deg)}}
.ear{transform-box:fill-box;transform-origin:50% 100%;transition:transform .4s var(--spring)}
.ear.a{animation:twA 5s infinite}.ear.b{animation:twB 4.3s 1s infinite}
@keyframes twA{0%,86%,100%{transform:rotate(0)}90%{transform:rotate(-14deg)}94%{transform:rotate(6deg)}}
@keyframes twB{0%,78%,100%{transform:rotate(0)}82%{transform:rotate(12deg)}88%{transform:rotate(-4deg)}}
.actor.alert .ear.a{animation:none;transform:rotate(-6deg) scaleY(1.08)}
.actor.alert .ear.b{animation:none;transform:rotate(6deg) scaleY(1.08)}
.actor.sad .ear.a{animation:none;transform:rotate(-70deg)}.actor.sad .ear.b{animation:none;transform:rotate(80deg)}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.nose{transform-box:fill-box;transform-origin:center;animation:sniff 1.1s infinite}
@keyframes sniff{50%{transform:scale(1.35)}}
.tail{transform-box:fill-box;transform-origin:center;animation:tail 1.6s infinite}
@keyframes tail{50%{transform:scale(1.15)}}
.head{transform-box:view-box;transform-origin:56px 66px}
.actor.nope .head{animation:nope .5s 3}
@keyframes nope{0%,100%{transform:none}25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
.actor.sad .head{transform:rotate(10deg) translateY(2px)}
.bubble{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translate(-50%,8px) scale(.8);opacity:0;white-space:nowrap;font-size:14px;font-weight:600;padding:7px 14px;border-radius:999px;background:#fff;color:#111;transition:.35s var(--spring);pointer-events:none;z-index:8}
.bubble.show{opacity:1;transform:translate(-50%,0) scale(1)}
.bubble.ok{background:var(--mint)}.bubble.bad{background:var(--coral);color:#fff}
.umb{position:absolute;left:50%;bottom:100px;width:104px;height:50px;margin-left:-52px;border-radius:104px 104px 0 0;background:var(--coral);scale:0;transform-origin:50% 100%;transition:scale .55s var(--spring);z-index:2}
.umb::after{content:"";position:absolute;left:50%;top:100%;width:3px;height:30px;margin-left:-1px;background:#d9d9de}
.actor.umb-on .umb{scale:1}

/* ----- 날씨 (if-else) ----- */
.cloud{top:30px;left:50%;width:180px;height:56px;margin-left:-90px;--d:-6;border-radius:40px;background:#8c97b0;transition:background 1s;cursor:pointer}
.cloud::before,.cloud::after{content:"";position:absolute;border-radius:50%;background:inherit}
.cloud::before{width:70px;height:70px;left:24px;top:-36px}.cloud::after{width:54px;height:54px;left:92px;top:-22px}
.cloud.dark{background:#566079}
.cloud:hover{animation:wob .5s}
@keyframes wob{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.rain{position:absolute;inset:60px 0 84px 0;z-index:2;opacity:0;transition:opacity 1s;pointer-events:none;
  background:repeating-linear-gradient(100deg,transparent 0 16px,rgba(170,200,255,.55) 16px 17px,transparent 17px 30px);animation:rainfall2 .5s linear infinite}

@keyframes rainfall2{to{background-position:-16px 56px}}
.house{right:7%;bottom:84px;width:128px;z-index:4;--d:6}

.pbk{position:absolute;left:44px;bottom:12px;width:40px;height:26px;border-radius:6px 6px 14px 14px;background:repeating-linear-gradient(0deg,#c9852a 0 5px,#e0a04a 5px 10px)}

/* ----- 반복문 ----- */
.basket{left:3%;bottom:84px;width:82px;z-index:4;--d:6;cursor:pointer}

@keyframes bump{40%{transform:scale(1.18,.86)}}

.bcount{position:absolute;left:50%;top:-34px;transform:translateX(-50%);background:#fff;color:#111;font-weight:700;font-size:14px;padding:4px 12px;border-radius:999px;white-space:nowrap;font-family:var(--mono)}

/* ----- 옵셔널 ----- */
.gift{left:60%;bottom:84px;width:132px;height:100px;z-index:4;--d:8;cursor:pointer}
.gbody{position:absolute;left:6px;bottom:0;width:120px;height:66px;background:#d44c54;border-radius:6px;overflow:hidden}
.gbody::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:12px;margin-left:-6px;background:#ffd36b}

.glid{position:absolute;left:0;bottom:62px;width:132px;height:26px;background:#ec5a62;border-radius:6px;transition:translate .6s var(--spring),rotate .6s var(--spring)}
.glid::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:12px;margin-left:-6px;background:#ffd36b}
.gift.open .glid{translate:-10px -34px;rotate:-14deg}

.gift.jig{animation:jig .5s 2}
@keyframes jig{25%{rotate:-4deg}75%{rotate:4deg}}

.gift.q .qmark{opacity:.85;animation:qfloat 2.4s ease-in-out infinite}
.dust{position:absolute;left:50%;top:10px;width:8px;height:8px;border-radius:50%;background:#bbb;opacity:0}
.gift.open .dust{animation:dust 1.6s ease-out infinite}
.dust:nth-of-type(2){animation-delay:.4s!important;margin-left:-16px}.dust:nth-of-type(3){animation-delay:.8s!important;margin-left:14px}
@keyframes dust{0%{opacity:.6;transform:translateY(0)}100%{opacity:0;transform:translateY(-44px) scale(1.6)}}

/* ---------- 질문 / 선택지 ---------- */
.qa{margin-top:26px;padding:0 6px}
.q{font-size:clamp(22px,3vw,34px);font-weight:600;letter-spacing:-.035em}
.sub{margin-top:8px;color:var(--dim);font-size:14px}

.choice{--c:var(--mint);position:relative;overflow:hidden;background:#fff;color:#111;border-radius:999px;padding:22px 30px;text-align:left;
  display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:clamp(17px,1.8vw,22px);font-weight:600;letter-spacing:-.03em;
  transition:box-shadow .3s,transform .3s var(--spring);will-change:transform}

.choice::before{content:"";position:absolute;left:var(--cx,50%);top:var(--cy,50%);width:0;height:0;border-radius:50%;background:var(--c);translate:-50% -50%;transition:width .55s cubic-bezier(.2,.8,.2,1),height .55s cubic-bezier(.2,.8,.2,1)}
.choice:hover::before,.choice:focus-visible::before{width:900px;height:900px}
.choice:hover,.choice:focus-visible{outline:none;box-shadow:0 14px 44px -10px var(--c);animation:buzz .08s linear infinite}
@keyframes buzz{0%{translate:0 0}25%{translate:1.2px -.8px}50%{translate:-1px .8px}75%{translate:.8px 1px}100%{translate:0}}
.choice>*{position:relative;z-index:1}
.choice .k{font-family:var(--mono);font-size:13px;border:1.5px solid currentColor;border-radius:8px;padding:2px 9px;opacity:.55;flex:none}

.choice:hover .eq{opacity:1}
.eq i{width:4px;background:#111;border-radius:2px;height:30%;animation:eq .5s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:-.15s}.eq i:nth-child(3){animation-delay:-.3s}.eq i:nth-child(4){animation-delay:-.05s}
@keyframes eq{to{height:100%}}
.choice[disabled]{cursor:default;animation:none!important;box-shadow:none}
.choice[disabled]:not(.picked):not(.correct){opacity:.28}
.choice.correct{background:var(--mint)}
.choice.wrong{background:var(--coral);color:#fff}
.choice.correct::before,.choice.wrong::before{display:none}

/* ---------- 결과 ---------- */
.res{position:absolute;left:50%;top:50%;width:min(86%,410px);padding:30px 30px 26px;border-radius:34px;color:#150608;z-index:20;
  translate:-50% -50%;rotate:-5deg;scale:.4;opacity:0;pointer-events:none;transition:.6s var(--spring);box-shadow:0 40px 80px -20px rgba(0,0,0,.7)}
.res.show{scale:1;opacity:1;pointer-events:auto}
.res.pass{background:var(--mint)}.res.fail{background:var(--coral)}
.res .t{font-size:clamp(46px,7vw,72px);font-weight:700;letter-spacing:-.05em;line-height:.95}
.res.fail .t{animation:glitch .8s steps(2) 2}
@keyframes glitch{20%{transform:translate(-5px,2px);text-shadow:3px 0 #fff}40%{transform:translate(5px,-2px)}60%{transform:translate(-3px,1px);text-shadow:-3px 0 #fff}100%{transform:none}}
.res p{margin-top:14px;font-size:15px;line-height:1.55;font-weight:500;letter-spacing:-.01em}
.res code{font-family:var(--mono);background:rgba(0,0,0,.14);padding:1px 6px;border-radius:6px;font-size:.92em}
.meter{margin-top:14px;display:none}
.meter.show{display:block}
.meter .lab{font-size:12px;font-weight:600;letter-spacing:.04em;display:flex;justify-content:space-between}
.meter .trk{margin-top:6px;height:8px;border-radius:8px;background:rgba(0,0,0,.18);overflow:hidden}
.meter .trk i{display:block;height:100%;width:0;background:#150608;border-radius:8px;transition:width 1s .4s cubic-bezier(.2,.8,.2,1)}
.res .go{margin-top:18px;width:56px;height:56px;border-radius:50%;background:#fff;display:grid;place-items:center;transition:transform .4s var(--spring)}
.res .go:hover{transform:rotate(-180deg) scale(1.12)}
.res .go svg{width:24px;height:24px;stroke:#111;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

.shake{animation:screenShake .5s}
@keyframes screenShake{15%{transform:translate(-9px,3px)}35%{transform:translate(8px,-4px)}55%{transform:translate(-5px,2px)}75%{transform:translate(3px,-1px)}}
.flash{position:fixed;inset:0;z-index:40;pointer-events:none;background:radial-gradient(circle,transparent 35%,rgba(236,90,98,.55));opacity:0}
.flash.go{animation:fl .8s}
@keyframes fl{20%{opacity:1}100%{opacity:0}}
#confetti{position:fixed;inset:0;z-index:45;pointer-events:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="ambient"><i></i><i></i><i></i></div><div class="sheen"></div>

<div class="page" id="page">

    <div><span class="hint" id="hint">화면을 한 번 클릭하면 소리가 켜져요</span><button class="toggle" id="mute" type="button">sound · <span id="muteState">on</span></button></div>
  </div>

  <div class="stage-wrap">

              <button class="go" id="retry" type="button" aria-label="다시 하기"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-3-6.2"/><path d="M20 4v5h-5"/></svg></button>
            </div>
          </div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

/* =============================================================
   토끼 SVG (클래스 기반이라 여러 곳에 복제해서 쓸 수 있음)
   ============================================================= */
const RAB = `<svg viewBox="0 0 100 120" aria-label="토끼"><g class="flip"><g class="hop">
  <circle class="tail" cx="22" cy="90" r="9" fill="#fff"/>
  <ellipse cx="50" cy="88" rx="29" ry="24" fill="#f4f1ea"/>
  <ellipse cx="68" cy="106" rx="15" ry="7" fill="#e6e2d8"/><ellipse cx="38" cy="108" rx="9" ry="5" fill="#e6e2d8"/>
  <g class="head">
    <g class="ear a"><ellipse cx="50" cy="24" rx="7" ry="23" transform="rotate(-8 50 24)" fill="#f4f1ea"/><ellipse cx="50" cy="26" rx="3.2" ry="15" transform="rotate(-8 50 26)" fill="#f2a0b5"/></g>
    <g class="ear b"><ellipse cx="66" cy="26" rx="7" ry="22" transform="rotate(10 66 26)" fill="#f4f1ea"/><ellipse cx="66" cy="28" rx="3.2" ry="14" transform="rotate(10 66 28)" fill="#f2a0b5"/></g>
    <circle cx="58" cy="60" r="21" fill="#f4f1ea"/>
    <circle class="eye" cx="67" cy="56" r="3.6" fill="#111"/><circle cx="68.2" cy="54.8" r="1.1" fill="#fff"/>
    <circle cx="63" cy="66" r="4" fill="#f2a0b5" opacity=".5"/>
    <circle class="nose" cx="78" cy="62" r="2.6" fill="#ec5a62"/>
  </g></g></g></svg>`;
const CARROT = `<svg class="carrot" viewBox="0 0 24 40"><path d="M12 14C6 14 4 20 12 38 20 20 18 14 12 14Z" fill="#f0a23c"/><path d="M12 14q-6-8-3-12 3 4 3 12 0-8 5-11 1 6-5 11z" fill="#7bd36b"/></svg>`;
const actorHTML = (left) => `<div class="layer actor" style="left:${left}%"><div class="bubble"></div><div class="umb"></div><div class="shadow"></div>${RAB}</div>`;

/* =============================================================
   오디오 (Web Audio 합성). 호버 베이스는 더 낮고, 3.4초 안에 스스로 사라진다.
   ============================================================= */
const Au = {
  ctx: null, master: null, on: true,
  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    this.ctx = new AC(); this.master = this.ctx.createGain(); this.master.gain.value = .9; this.master.connect(this.ctx.destination);
    this.nbuf = this.ctx.createBuffer(1, this.ctx.sampleRate, this.ctx.sampleRate);
    const d = this.nbuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  },
  ready() { return this.on && this.ctx && this.ctx.state === "running"; },
  /** 서브 베이스: 천천히 차오르고 dur초 안에 페이드아웃. 호버를 유지해도 계속 울리지 않는다. */
  hum(freq = 38, vol = .5, dur = 3.4) {
    if (!this.ready()) return null;
    const c = this.ctx, t = c.currentTime;
    const out = c.createGain();
    out.gain.setValueAtTime(0.0001, t);
    out.gain.exponentialRampToValueAtTime(vol, t + .22);
    out.gain.exponentialRampToValueAtTime(vol * .5, t + dur * .45);
    out.gain.exponentialRampToValueAtTime(.0001, t + dur);
    const lp = c.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 190; lp.Q.value = 3;
    const trem = c.createGain(); trem.gain.value = .85;
    const lfo = c.createOscillator(); lfo.frequency.value = 8; const la = c.createGain(); la.gain.value = .15; lfo.connect(la); la.connect(trem.gain);
    const sub = c.createOscillator(); sub.type = "sine"; sub.frequency.value = freq;
    const h = c.createOscillator(); h.type = "triangle"; h.frequency.value = freq * 2; const hg = c.createGain(); hg.gain.value = .45; // 작은 스피커에서도 들리도록 2배음
    sub.connect(trem); h.connect(hg); hg.connect(trem); trem.connect(lp); lp.connect(out); out.connect(this.master);
    const end = t + dur + .1; sub.start(); h.start(); lfo.start(); sub.stop(end); h.stop(end); lfo.stop(end);
    return { stop: () => { const n = c.currentTime; out.gain.cancelScheduledValues(n); out.gain.setValueAtTime(Math.max(out.gain.value, .0001), n); out.gain.exponentialRampToValueAtTime(.0001, n + .18); } };
  },
  tone(type, f0, f1, dur, vol = .25, delay = 0) {
    if (!this.ready()) return; const c = this.ctx, t = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + .05);
  },
  noise(f0, f1, dur, vol = .2, q = 1.2) {
    if (!this.ready()) return; const c = this.ctx, t = c.currentTime;
    const s = c.createBufferSource(); s.buffer = this.nbuf; s.loop = true;
    const bp = c.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = q; bp.frequency.setValueAtTime(f0, t); bp.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = c.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + dur * .3); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(bp); bp.connect(g); g.connect(this.master); s.start(t); s.stop(t + dur + .05);
  },
  click() { this.tone("square", 300, 900, .09, .1); this.tone("sine", 80, 40, .25, .4); },
  hop() { this.tone("sine", 260, 520, .09, .14); },
  softHop() { this.tone("sine", 300, 480, .08, .05); },
  tick() { this.tone("triangle", 880, 880, .05, .08); },
  softTick() { this.tone("triangle", 1040, 1040, .05, .035); },
  tip() { this.tone("sine", 1200, 1500, .05, .05); },
  pop(i) { this.tone("triangle", 520 + i * 160, 700 + i * 200, .14, .18); },
  softPop(i) { this.tone("triangle", 560 + i * 120, 700 + i * 140, .12, .05); },
  whoosh(v = .12) { this.noise(300, 2600, .35, v); },
  patter() { this.noise(3200, 6500, .9, .035, .8); },
  rustle() { this.noise(2200, 5000, .5, .1, .6); },
  creak() { this.tone("sawtooth", 95, 62, .38, .06); this.tone("square", 140, 90, .3, .03, .08); },

    <div class="pgift" style="left:130px;bottom:100px"></div><div class="plid" style="left:124px;bottom:148px"></div>
    <div class="mrab peek" style="left:50px;bottom:100px">${RAB}</div>`,
  code: [
    `let gift: ${T("String?: 값이 있을 수도, nil일 수도 있는 옵셔널이에요", "ty", "String?")} = ${T("nil: 값이 없다는 뜻이에요", "kw", "nil")}`,
    `let item = gift ${T("??: 왼쪽이 nil이면 오른쪽 기본값을 써요", "kw", "??")} <span class="str">"빈 상자"</span>`,
    `rabbit.${T("item을 말해요", "fn", "say")}(item)`,
  ],
  question: "토끼가 말하는 item은 무엇일까요?",
  choices: ["nil", "빈 상자", "에러가 난다"], correct: 1,
  scene() {
    return `<div class="layer star" style="top:38px;left:14%;--d:-2"></div><div class="layer star" style="top:70px;left:44%;animation-delay:-1s;--d:-2"></div><div class="layer star" style="top:30px;left:76%;animation-delay:-2s;--d:-2"></div><div class="layer moon"></div>
      <div class="layer bank full"></div>
      <div class="layer gift" id="gift"><span class="qmark">?</span><div class="gbody"><div class="inside"></div></div><div class="glid"></div><i class="dust"></i><i class="dust"></i><i class="dust"></i></div>
      <div class="layer tagc" id="tag"></div>${actorHTML(24)}`;
  },
  init() { qs("#gift").addEventListener("pointerenter", () => Au.lid()); },
  hoverReact(i, on) { if (on) actor.classList.add("alert"); else actor.classList.remove("alert"); },
  async run(h) {
    const gift = qs("#gift");
    h.hl(1); h.st("line 1 · gift: String? = nil"); gift.classList.add("q", "jig"); showTag("gift = nil"); actor.classList.add("alert"); Au.chime(); await sleep(1500);
    h.hl(2); h.st('line 2 · gift ?? "빈 상자"'); await moveTo(46, 1500); say('gift ?? "빈 상자"'); await sleep(900);
    gift.classList.add("open"); Au.lid(); await sleep(800); say("gift는 nil → 기본값 사용", "bad"); showTag('nil → "빈 상자"'); await sleep(1500); hush();
    h.hl(3); h.st('line 3 · rabbit.say("빈 상자")'); showTag('item = "빈 상자"'); actor.classList.remove("alert"); await sleep(400);
    say("빈 상자", "ok"); actor.classList.add("poke"); await sleep(1800); actor.classList.remove("poke"); hush();
  },
  explain(ok) {
    return ok ? `<code>gift</code>가 <code>nil</code>이라 <code>??</code> 오른쪽 기본값 <code>"빈 상자"</code>가 <code>item</code>에 들어가요. 그래서 토끼는 "빈 상자"라고 말해요.`
      : `<code>??</code>는 왼쪽이 <code>nil</code>이면 오른쪽 값을 대신 써요. 에러가 나거나 nil이 그대로 나오지 않고 <code>item</code>은 <b>"빈 상자"</b>가 돼요.`;
  },
  sfx: [[420, () => Au.softTick()], [1000, () => Au.lid()], [1350, () => Au.chime()]],
};

const GAMES = [guardGame, ifGame, loopGame, optGame];

/* =============================================================
   홈 화면 (카드 3장: 코드 / 그림 / 선택지)
   ============================================================= */
const ARROW = `<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`;
function cardHTML(g, hero) {
  return `<section class="card ${hero ? "hero" : "mini"}" data-game="${g.id}" data-hum="${g.hum}">
    <div class="copy"><div class="title"><div class="tile" style="background:${g.tileBg}"><svg viewBox="0 0 24 24">${g.icon}</svg></div>
      <h2 class="name">${g.title}</h2>${g.badge ? `<span class="badge">${g.badge}</span>` : ""}</div>
      <p class="desc">${g.desc}</p><button class="pill" data-magnet data-play="${g.id}" type="button">play ${g.title} <span class="arr">→</span></button></div>
    <div class="stack" style="--c:${g.hex}">
      <div class="plate p3"><div class="inner"><span class="meta">Q.1 · 선택지</span><div class="pchips">${g.prevChips.map((c) => `<span class="chip">${c}</span>`).join("")}</div></div></div>
      <div class="plate p2"><div class="inner"><div class="pic">${g.prevPic}</div></div></div>
      <div class="plate p1" style="background:${g.hex}"><div class="inner"><span class="meta">1 / 5 · 코드</span><div class="pcode">${g.prevCode}</div></div></div>
    </div></section>`;
}
$("homeCards").innerHTML = cardHTML(GAMES[0], true) + `<div class="row">${GAMES.slice(1).map((g) => cardHTML(g, false)).join("")}</div>`;
document.querySelector(".hero").style.marginBottom = "22px";

let sfxTimers = [];
function clearSfx() { sfxTimers.forEach(clearTimeout); sfxTimers = []; }
document.querySelectorAll("#homeCards .card").forEach((card) => {
  const g = GAMES.find((x) => x.id === card.dataset.game);
  card.addEventListener("pointermove", (e) => {
    const r = card.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    card.style.setProperty("--px", x + "px"); card.style.setProperty("--py", y + "px");
    card.style.setProperty("--mx", ((x / r.width) - .5) * 2); card.style.setProperty("--my", ((y / r.height) - .5) * 2);
  });
  card.addEventListener("pointerenter", () => {
    Au.whoosh(.07); startHum(g.hum, .3, 3.4); clearSfx();
    sfxTimers = g.sfx.map(([ms, fn]) => setTimeout(fn, ms));
  });
  card.addEventListener("pointerleave", () => { card.style.setProperty("--mx", 0); card.style.setProperty("--my", 0); stopHum(); clearSfx(); });
});

/* 알약 버튼 자석 효과 */
function magnet(b) {
  b.addEventListener("pointermove", (e) => { const r = b.getBoundingClientRect(); b.style.transform = `translate(${(e.clientX - (r.left + r.width / 2)) * .22}px,${(e.clientY - (r.top + r.height / 2)) * .3}px)`; });
  b.addEventListener("pointerenter", () => Au.tone("sine", 500, 760, .08, .07));
  b.addEventListener("pointerleave", () => { b.style.transform = ""; });
}
document.querySelectorAll("[data-magnet]").forEach(magnet);

/* =============================================================
   플레이 화면
   ============================================================= */
const codeEl = $("code"), choicesEl = $("choices"), statusEl = $("status"), sceneEl = $("scene");
let cur = null, locked = false;
const h = {
  hl(n, bad = false) {
    codeEl.querySelectorAll(".ln.active").forEach((e) => { e.classList.remove("active", "bad"); e.classList.add("done"); });
    const e = codeEl.querySelector(`[data-line="${n}"]`); e.classList.remove("done", "idle"); e.classList.add("active"); if (bad) e.classList.add("bad"); Au.tick();
  },
  st(text, cls = "exec") { $("stxt").textContent = text; statusEl.className = "status " + cls; },
};

sceneEl.addEventListener("pointermove", (e) => {
  const r = sceneEl.getBoundingClientRect();
  sceneEl.style.setProperty("--mx", ((e.clientX - r.left) / r.width - .5) * 2); sceneEl.style.setProperty("--my", ((e.clientY - r.top) / r.height - .5) * 2);
});
sceneEl.addEventListener("pointerleave", () => { sceneEl.style.setProperty("--mx", 0); sceneEl.style.setProperty("--my", 0); });
codeEl.addEventListener("pointerover", (e) => {
  const t = e.target.closest(".tok"); if (!t) return; Au.tip();
  if (t.dataset.pair) codeEl.querySelectorAll(`[data-pair="${t.dataset.pair}"]`).forEach((x) => x.classList.add("pair"));
});
codeEl.addEventListener("pointerout", (e) => { if (e.target.closest(".tok")) codeEl.querySelectorAll(".pair").forEach((x) => x.classList.remove("pair")); });

function buildScene() {
  world = $("world"); world.innerHTML = cur.scene();
  actor = qs(".actor"); bubble = qs(".bubble");
  qs(".actor svg").addEventListener("pointerenter", () => {
    if (locked) return; Au.squeak(); actor.classList.remove("poke"); void actor.offsetWidth; actor.classList.add("poke"); setTimeout(() => actor.classList.remove("poke"), 600);
  });
  cur.init();
}
function reset() {
  locked = false; $("res").className = "res"; $("meter").classList.remove("show"); $("meterBar").style.width = "0";
  choicesEl.querySelectorAll(".choice").forEach((b, i) => { b.disabled = false; b.className = "choice c" + i; });
  codeEl.querySelectorAll(".ln").forEach((e) => { e.classList.remove("active", "done", "bad"); e.classList.add("idle"); });
  buildScene(); h.st("답을 고르면 코드가 실행돼요", "");
}
function startGame(id) {
  cur = GAMES.find((g) => g.id === id); stopHum(); clearSfx();
  $("prog").innerHTML = `<b>${cur.title}</b> · 1 / 1`;
  codeEl.innerHTML = ""; cur.code.forEach((html, i) => { const d = document.createElement("div"); d.className = "ln idle"; d.dataset.line = i + 1; d.dataset.n = i + 1; d.innerHTML = html || " "; codeEl.appendChild(d); });
  $("qtext").textContent = cur.question; $("qsub").textContent = cur.sub || "코드 위에 마우스를 올려 보세요. 단축키 [A] [B] [C]";
  const FREQ = [40, 34, 44];
  choicesEl.innerHTML = "";
  cur.choices.forEach((label, i) => {
    const b = document.createElement("button"); b.type = "button"; b.className = "choice c" + i;
    b.innerHTML = `<span>${label}</span><span class="eq"><i></i><i></i><i></i><i></i></span><span class="k">${"ABC"[i]}</span>`;
    b.addEventListener("pointerenter", () => { if (locked) return; startHum(FREQ[i], .55, 3.4); if (navigator.vibrate) navigator.vibrate(18); cur.hoverReact(i, true); });
    b.addEventListener("pointermove", (e) => {
      if (b.disabled) return; const r = b.getBoundingClientRect();
      b.style.setProperty("--cx", (e.clientX - r.left) + "px"); b.style.setProperty("--cy", (e.clientY - r.top) + "px");
      b.style.transform = `translate(${(e.clientX - r.left - r.width / 2) * .03}px,${(e.clientY - r.top - r.height / 2) * .12}px)`;
    });
    const leave = () => { stopHum(); b.style.transform = ""; if (!locked) cur.hoverReact(i, false); };
    b.addEventListener("pointerleave", leave); b.addEventListener("blur", leave);
    b.addEventListener("focus", () => { if (!locked) { startHum(FREQ[i], .55, 3.4); cur.hoverReact(i, true); } });
    b.addEventListener("click", () => choose(i));
    choicesEl.appendChild(b);
  });
  reset();
}
async function choose(i) {
  if (locked || !cur) return; locked = true; stopHum(); Au.click();
  const bs = choicesEl.querySelectorAll(".choice"); bs.forEach((b, k) => { b.disabled = true; if (k === i) b.classList.add("picked"); });
  cur.hoverReact(i, false); h.st("선택 완료 · 실행 시작"); await sleep(450);
  await cur.run(h);
  const ok = i === cur.correct; bs[cur.correct].classList.add("correct"); if (!ok) bs[i].classList.add("wrong");
  showResult(ok, i);
}
function showResult(ok, idx) {
  const r = $("res"); r.className = "res show " + (ok ? "pass" : "fail");
  $("resT").textContent = ok ? "clear!" : "game over"; $("resP").innerHTML = cur.explain(ok, idx);
  if (cur.numeric) {
    const v = cur.values[idx], pct = Math.max(0, Math.round((1 - Math.abs(v - cur.answerValue) / cur.answerValue) * 100));
    $("meter").classList.add("show"); $("meterV").textContent = `${pct}%  ·  선택 ${v} / 정답 ${cur.answerValue}`; requestAnimationFrame(() => requestAnimationFrame(() => { $("meterBar").style.width = pct + "%"; }));
  }
  if (ok) { h.st("pass", "pass"); Au.win(); burst(); }
  else { h.st("fail", "fail"); Au.lose(); const pc = $("playCard"); pc.classList.add("shake"); $("flash").classList.add("go"); setTimeout(() => { pc.classList.remove("shake"); $("flash").classList.remove("go"); }, 900); }
}
$("retry").addEventListener("click", reset);
addEventListener("keydown", (e) => {
  if ($("playView").classList.contains("hidden") || !cur) return; const k = e.key.toLowerCase(), n = "abc".indexOf(k), m = "123".indexOf(k);
  const i = n >= 0 ? n : m; if (i >= 0 && i < cur.choices.length) choose(i);
});

/* 화면 전환 */
function show(view) {
  const hm = $("home"), p = $("playView"); stopHum(); clearSfx();
  if (view === "play") { hm.classList.add("hidden"); p.classList.remove("hidden"); scrollTo({ top: 0, behavior: "smooth" }); }
  else { p.classList.add("hidden"); hm.classList.remove("hidden"); }
  Au.whoosh();
}
document.querySelectorAll("[data-play]").forEach((b) => b.addEventListener("click", () => { startGame(b.dataset.play); show("play"); }));
$("back").addEventListener("click", () => show("home"));
magnet($("back"));

/* 폭죽 */
const cv = $("confetti"), cx = cv.getContext("2d"); let parts = [], raf = null;
function fit() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
addEventListener("resize", fit); fit();
function burst() {
  const colors = ["#9bc6ae", "#ec5a62", "#f0a23c", "#4aa3f0", "#ffffff", "#b9f26b"], W = cv.width, H = cv.height, d = devicePixelRatio;
  for (const ox of [.2, .5, .8]) for (let i = 0; i < 90; i++) {
    const a = -Math.PI / 2 + (Math.random() - .5) * 1.5, s = (9 + Math.random() * 13) * d;
    parts.push({ x: W * ox, y: H * .62, vx: Math.cos(a) * s, vy: Math.sin(a) * s, w: (6 + Math.random() * 8) * d, h: (4 + Math.random() * 6) * d, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: colors[(Math.random() * colors.length) | 0], life: 0, max: 130 + Math.random() * 60 });
  }
  if (!raf) raf = requestAnimationFrame(tick);
}
function tick() {
  cx.clearRect(0, 0, cv.width, cv.height); const d = devicePixelRatio; parts = parts.filter((p) => p.life < p.max);
  for (const p of parts) { p.life++; p.vy += .38 * d; p.vx *= .99; p.vy *= .992; p.x += p.vx; p.y += p.vy; p.r += p.vr; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.globalAlpha = Math.min(1, (p.max - p.life) / 40); cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cx.restore(); }
  raf = parts.length ? requestAnimationFrame(tick) : null;
}
</script>
</body>
</html>
